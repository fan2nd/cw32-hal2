  - 33
  memory_size_table_pdf_page_indices:
  - 8
  memory_map_evidence: Per-family table explicitly places main Flash at0x00000000 and SRAM at0x20000000.
    Family-product table establishes package/size variant.
  af_evidence: Tables 5-3 through 5-6; 90 serial cells checked by positioned-PDF and independent pdftotext
    extraction; rendered PDF pages [31, 32] reviewed. See docs/remaining-serial-af-evidence.json.
  source_ref: vendor:CW32W031_DataSheet_CN_V1.3.pdf
scope: UART/SPI/I2C serial digital routes only; no unrelated SDK AF candidate promoted.
normalization:
  TXD: TX
  RXD: RX
  CS: NSS
  singleton_instances:
    SPI: SPI1
    I2C: I2C1
  basis: Exact family datasheet functions; SDK/PAC singleton instance names retained, all family-specific
    differences explicit.
limitations:
- Datasheet pin/AF/function cells are the hardware authority; SDK corroboration is optional and disagreements
  are recorded explicitly.
- Exact physical package bonding filters metadata. HAL additionally withholds PA13/PA14 SWD and input-only
  PF3; radio-internal pads are not projected.
- AF0 is GPIO. Only documented selectors 1-7 are admitted; codes 8-15 and blank cells are unsupported.
- CTS/RTS/NSS remain metadata only unless a reviewed HAL API explicitly exposes those signals.
- Oscillator-pad serial use requires external circuitry and RCC configuration compatible with GPIO use.
- No silicon validation or additional DMA compatibility claim.
- 'Datasheet section 4.4.4: external SPI is unavailable while the RF subsystem is in use. No simultaneous
  RF/SPI operation is supported; the RF driver is not implemented.'
