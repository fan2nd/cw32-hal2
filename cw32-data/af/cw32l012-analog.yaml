limitations:
- Source-level route qualification only; no silicon validation.
- ADC1 and ADC2 have independent per-instance mux meanings. Shared physical pads remain separate instance
  routes with explicit hardware mux metadata.
- Only external mux0..11 are GPIO routes. Mux12 and mux13 are internal DAC_OUT2 and DAC_OUT1 connections
  and never GPIO routes.
- Internal TS/BGR channels14/15 and the shared BGR, ADC clock gate and reset require separate HAL ownership;
  route metadata alone does not authorize them.
