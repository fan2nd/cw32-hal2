limitations:
- Source-level route qualification only; no hardware validation.
- Logical signal names, sequence slots and hardware mux encodings are distinct concepts.
- Only externally bonded safe GPIO routes become pin metadata. Internal TS/BGR sources never become pin
  routes.
- Oscillator-alias pins require exclusive GPIO ownership and must not be used while their oscillator function
  is active.
