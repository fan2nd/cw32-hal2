limitations:
- Source-level route qualification only; no hardware validation.
- Source signal identities and hardware mux encodings are independent.
- Package bonding and ownership are mandatory. No external-reference, DMA, scan, trigger or wider-resolution
  support is implied.
- SDK channel comments 8-12 incorrectly use the L052/L083 pad map. Own datasheet Table 5-2 and own RM
  Table 22-5 agree on PB0/PB1/PB2/PB10/PB11; SDK macro encodings remain 8-12.
