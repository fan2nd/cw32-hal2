  af_evidence: 'Datasheet Tables 5-3 through 5-6, printed pages 26-27 (PDF pages 27-28); all 116 UART/SPI/I2C
    pin/AF/function cells independently compared with SDK macros and older official PDF; rendered tables
    inspected. Per-route audit: docs/f020-serial-af-evidence.json.'
  source_ref: vendor:current-datasheets/CW32F020_DataSheet_CN_V1.3.pdf
scope: Serial digital routes only. Does not promote timer, analog, clock, debug, RTC or other candidate
  routes.
normalization:
  TXD: TX
  RXD: RX
  CS: NSS
  basis: Standard signal spelling; original vendor function, source_signal and macro retained.
limitations:
- Only the 116 independently compared UART/SPI/I2C routes are present; no other candidate AF route is
  promoted.
- Exact package bonding must filter these die-level routes before typed HAL hooks are emitted.
- CTS/RTS/NSS routes are data only; current HAL exposes UART TX/RX, SPI SCK/MISO/MOSI and I2C SCL/SDA.
- No silicon validation; SWD and oscillator pin restrictions still apply.
- No DMA compatibility or routing assertion.
