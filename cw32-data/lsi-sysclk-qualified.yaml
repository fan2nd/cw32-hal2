      - Figure 22-1 and the full sixteen-entry IRMOD table enumerate timer/UART combinational modulation. Section 22.3.3 states
        that IR receive demodulation is external.
      conclusion: No independent clock root. All sources terminate at the timer/UART graph; IR pin behavior is part of GPIO/external
        handover.
    - id: gpio_branch
      peripherals:
      - GPIOA
      - GPIOB
      - GPIOC
      - GPIOD
      - GPIOF
      rm_pdf_pages:
      - 50
      - 51
      - 81
      - 142
      - 144
      - 145
      - 157
      - 491
      - 504
      rm_printed_pages:
      - 49
      - 50
      - 80
      - 141
      - 143
      - 144
      - 156
      - 490
      - 503
      selectors:
        GPIOx.FILTER@0x40.FLTCLK[18:16]:
          '0': HCLK/2
          '1': HCLK/4
          '2': HCLK/8
          '3': BTIM1 overflow
          '4': RC150K
          '5': LSI
          '6': RC10K
          '7': LPTIM PWM
        GPIOx.FILTER.PIN[15:0]: per-pin filter enables
      positive_evidence:
      - 'Figure 9-1 was visually inspected: the AF peripheral-input branch is separate from the digital interrupt filter and
        HCLK IDR synchronizer. Section 9.3.3 states the same input split.'
      - FILTER explicitly clocks the interrupt filtering branch. Its raw 3/7 choices carry timer-derived clocks. ADC_TRIGGER
        can then consume the resulting GPIO interrupt.
      - All A/B/C/D/F register banks exist regardless of package bonding; a package-specific unbonded route cannot create a
        public pin token.
      conclusion: Keep GPIO in complete LSI admission. An enabled filter selecting raw 5 is direct; raw 3/7 close only through
        BTIM/LPTIM closure. Do not assume GPIO FILTER clocks timer/SPI/I2C AF input filters. Whole-bank clock enabling/restoring
        is a functional handover.
    - id: mco_branch
      peripherals:
      - SYSCTRL.MCO
      rm_pdf_pages:
      - 50
      - 89
      - 90
      - 91
      - 92
      - 94
      rm_printed_pages:
      - 49
      - 88
      - 89
      - 90
      - 91
      - 93
      selectors:
        SYSCTRL.MCO@0x70.SOURCE[3:0]:
          '0': no output
          '1': HCLK
          '2': PCLK
          '3': HSIOSC
          '4': LSI
          '5': HSE
          '6': LSE
          '8': RC150K
          '9': RC10K
        SYSCTRL.MCO.DIV[6:4]:
        - 1
        - 2
        - 8
        - 64
        - 128
        - 256
        - 512
        - 1024
      positive_evidence:
      - The MCO table provides a no-output value and eight oscillator/bus routes. Raw 7 and 10..15 have no defined source.
      - The ATIM/GTIM mux tables consume MCO internally, independently of any MCO output GPIO configuration.
      conclusion: Cold admission must reject SOURCE=4 without testing whether an MCO pad is bonded/enabled. The proof uses documented
        selector states; it assigns no safe meaning to reserved encodings.

