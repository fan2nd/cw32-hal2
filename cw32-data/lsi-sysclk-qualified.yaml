        clocked oscillator consumer. FLASH read waits are explicitly counted in HCLK. CRC full controls select algorithms and
        accept data via AHB.
      conclusion: No additional direct LSI root. Bus users inherit LSI only through admitted SYSCLK; event-triggered DMA depends
        on upstream peripheral closures. This does not authorize Flash programming or claim its analog timing is qualified.
