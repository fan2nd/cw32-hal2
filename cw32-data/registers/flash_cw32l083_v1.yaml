enum/Mode:
  description: Main FLASH operation, qualified by the own FLASH control chapter; see docs/flash-next-batch-audit.json.
  bit_size: 2
  variants:
  - name: READ
    description: Read operation.
    value: 0
  - name: PROGRAM
    description: Program an erased byte, halfword or word.
    value: 1
  - name: PAGE_ERASE
    description: Erase the page selected by the triggering store.
    value: 2
  - name: CHIP_ERASE
    description: Erase the whole main array. Not exposed by the reserved-region HAL storage API.
    value: 3
