  fields:
  - name: END
    description: Calibration ended, not proof of success.
    bit_offset: 0
    bit_size: 1
  - name: OK
    description: Calibration reached its frequency-error target.
    bit_offset: 1
    bit_size: 1
  - name: UD
    description: Timer underflow event; multiple periods coalesce.
    bit_offset: 3
    bit_size: 1
  - name: OV
    description: Calibration trim code reached 0 or 0x1ff; not counter overflow.
    bit_offset: 4
    bit_size: 1
  - name: MISS
    description: Calibration interval count was missed.
    bit_offset: 5
    bit_size: 1
