enum/Mode:
  description: Own-family CN UM section 11; see docs/autotrim-counter-evidence.json.
  bit_size: 2
  variants:
  - name: HSI_CALIBRATION
    description: HSIOSC calibration; unsafe oscillator ownership is outside the safe HAL.
    value: 0
  - name: LSI_CALIBRATION
    description: LSI calibration; unsafe oscillator ownership is outside the safe HAL.
    value: 1
  - name: TIMER
    description: Periodic down-counter, with automatic trim disabled.
    value: 3
enum/Source:
  description: Own-family CN UM section 11; see docs/autotrim-counter-evidence.json.
  bit_size: 3
  variants:
  - name: HSI_OSC
    description: Undivided nominal 48 MHz HSIOSC.
    value: 0
  - name: LSI
    description: Internal low-speed oscillator.
    value: 1
  - name: HSE
    description: External high-speed oscillator.
    value: 2
  - name: LSE
    description: External low-speed oscillator.
    value: 3
  - name: ETR
    description: External input.
    value: 4
enum/Prescaler:
