block/AUTOTRIM:
  description: Automatic trim and independent timer. Safe HAL exposes only MD=3/AUTO=0; see docs/autotrim-counter-evidence.md.
  items:
  - name: CR
    description: desc CR.
    byte_offset: 0
    fieldset: CR
  - name: ARR
    description: desc ARR.
    byte_offset: 4
    fieldset: ARR
  - name: CNT
    description: desc CNT.
    byte_offset: 8
    access: Read
    fieldset: CNT
  - name: IER
    description: desc IER.
    byte_offset: 16
    fieldset: IER
  - name: ISR
    description: desc ISR.
    byte_offset: 20
    access: Read
    fieldset: ISR
  - name: ICR
    description: desc ICR.
    byte_offset: 28
    fieldset: ICR
  - name: FCAP
    description: desc FCAP.
    byte_offset: 128
    access: Read
    fieldset: FCAP
  - name: TVAL
    description: desc TVAL.
    byte_offset: 132
    access: Read
    fieldset: TVAL
  - name: FLIM
    description: desc FLIM.
    byte_offset: 136
    access: Read
    fieldset: FLIM
