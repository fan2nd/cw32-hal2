enum/Source:
  description: Own F002 RM Rev 1.4 PDF p129 and F003 RM Rev 2.3 PDF p131; see cw32-data/hex-qualified.yaml. External pads are selected independently of system HEX.PINMUX.
  bit_size: 3
  variants:
  - name: HSIOSC
    description: Undivided HSI oscillator.
    value: 0
  - name: LSI
    description: Internal low-speed oscillator.
    value: 1
  - name: HEX_PB0
    description: External clock from PB00, independently selected from the system HEX input.
    value: 2
  - name: HEX_PB1
    description: External clock from PB01, independently selected from the system HEX input.
    value: 3
  - name: ETR
    description: External timer trigger input.
    value: 4
