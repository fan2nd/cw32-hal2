    description: Hysteresis disabled.
    value: 0
  - name: LOW
    description: Approximately 10 mV hysteresis; typical only.
    value: 1
  - name: MEDIUM
    description: Approximately 20 mV hysteresis; typical only.
    value: 2
  - name: HIGH
    description: Approximately 30 mV hysteresis; typical only.
    value: 3
