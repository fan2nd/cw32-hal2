enum/Source:
  description: Own L052 RM section 12.5.3 RTC clock source; values 1 and 3 are reserved.
  bit_size: 3
  variants:
  - name: LSE
    description: External low-speed clock.
    value: 0
  - name: LSI
    description: Internal low-speed clock.
    value: 2
  - name: HSE_DIV128
    description: External high-speed clock divided by 128.
    value: 4
  - name: HSE_DIV256
    description: External high-speed clock divided by 256.
    value: 5
  - name: HSE_DIV512
    description: External high-speed clock divided by 512.
    value: 6
  - name: HSE_DIV1024
    description: External high-speed clock divided by 1024.
    value: 7
