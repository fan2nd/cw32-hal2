block/TRNG:
  description: CW32L083 TRNG, own User Manual CN Rev2.0; see docs/l083-aes-trng-evidence.md.
  items:
  - name: CR1
    description: desc CR1.
    byte_offset: 0
    fieldset: CR1
  - name: CR2
    description: desc CR2.
    byte_offset: 4
    fieldset: CR2
  - name: DATA0
    description: desc DATA0.
    byte_offset: 12
    access: Read
    fieldset: DATA0
  - name: DATA1
    description: desc DATA1.
    byte_offset: 16
    access: Read
    fieldset: DATA1
fieldset/CR1:
  description: desc CR1.
  fields:
  - name: EN
    description: desc EN.
    bit_offset: 0
    bit_size: 1
  - name: START
    description: Write 1 to start; read 0 after completion, read 1 while active. W0 abort is not documented.
    bit_offset: 1
    bit_size: 1
    enum: Operation
fieldset/CR2:
  description: desc CR2.
  fields:
  - name: SOURCE
    description: desc SOURCE.
    bit_offset: 0
    bit_size: 2
    enum: Source
  - name: SHIFT
    description: desc SHIFT.
    bit_offset: 2
    bit_size: 3
    enum: Shift
fieldset/DATA0:
  description: desc DATA0.
  fields:
  - name: DATA0
    description: Output bits31:0; valid only after a submitted operation completes. No health or error status
      is documented.
    bit_offset: 0
    bit_size: 32
fieldset/DATA1:
  description: desc DATA1.
  fields:
  - name: DATA1
    description: Output bits63:32; valid only after a submitted operation completes. No health or error status
      is documented.
    bit_offset: 0
    bit_size: 32
enum/Operation:
  description: START command/status, CW32L083 UM Rev2.0 section 26.6.1. Writing zero is not an abort.
  bit_size: 1
  variants:
  - name: IDLE
    value: 0
    description: 'Read: operation complete. Write-zero behavior is unspecified.'
  - name: ACTIVE
    value: 1
    description: 'Read: operation busy. Write: start an operation.'
enum/Source:
  description: LFSR input, UM section26.6.2. Feedback-only is deterministic and excluded by HAL.
  bit_size: 2
  variants:
  - name: FEEDBACK
    value: 0
  - name: ANALOG
    value: 1
  - name: ANALOG_XOR_FEEDBACK
    value: 2
enum/Shift:
  description: LFSR shift count, UM section26.6.2. Other encodings are undocumented.
  bit_size: 3
  variants:
  - name: CYCLES8
    value: 1
  - name: CYCLES16
    value: 2
  - name: CYCLES32
    value: 3
  - name: CYCLES64
    value: 4
  - name: CYCLES128
    value: 5
  - name: CYCLES256
    value: 6
