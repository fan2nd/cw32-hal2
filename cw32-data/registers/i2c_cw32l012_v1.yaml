enum/Command:
  description: MTDR commands from CW32L012 UM CN V1.4 section 23.8.11, printed page
    552. Encodings 6 and 7 are not specified.
  bit_size: 3
  variants:
  - name: TRANSMIT
    description: Transmit DATA as one byte.
    value: 0
  - name: RECEIVE
    description: Receive DATA+1 bytes into MRDR.
    value: 1
  - name: STOP
    description: Generate STOP.
    value: 2
  - name: RECEIVE_DISCARD
    description: Receive DATA+1 bytes without storing in MRDR.
    value: 3
  - name: START_EXPECT_ACK
    description: Generate START or repeated START and transmit DATA, expecting ACK.
    value: 4
  - name: START_EXPECT_NACK
    description: Generate START or repeated START and transmit DATA, expecting NACK.
    value: 5
