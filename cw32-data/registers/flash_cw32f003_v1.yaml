block/FLASH:
  description: desc FLASH.
  items:
  - name: CR1
    description: Control register1.
    byte_offset: 0
    fieldset: CR1
  - name: CR2
    description: Control register2.
    byte_offset: 4
    fieldset: CR2
  - name: PAGELOCK
    description: Page Write Erase Lock.
    byte_offset: 8
    fieldset: PAGELOCK
  - name: IER
    description: Interrupt enable register.
    byte_offset: 32
    fieldset: IER
