fieldset/CR:
  description: "Operational amplifier control; reset 0x0000E000 per CN manual V1.4 \xA729.6.1."
  fields:
  - name: EN
    description: desc EN.
    bit_offset: 0
    bit_size: 1
  - name: MODE
    description: desc MODE.
    bit_offset: 1
    bit_size: 2
    enum: Mode
  - name: INP1EN
    description: desc INP1EN.
    bit_offset: 4
    bit_size: 1
  - name: INP2EN
    description: desc INP2EN.
    bit_offset: 5
    bit_size: 1
  - name: INP3EN
    description: desc INP3EN.
    bit_offset: 6
    bit_size: 1
  - name: INP4EN
    description: desc INP4EN.
    bit_offset: 7
    bit_size: 1
  - name: INN1EN
    description: desc INN1EN.
    bit_offset: 8
    bit_size: 1
  - name: INN2EN
    description: desc INN2EN.
    bit_offset: 9
    bit_size: 1
  - name: AMP
    description: desc AMP.
    bit_offset: 10
    bit_size: 3
    enum: Gain
  - name: BIAS
    description: desc BIAS.
    bit_offset: 13
    bit_size: 3
    enum: Bias
enum/Mode:
  bit_size: 2
  variants:
  - name: External
    description: External feedback network.
    value: 0
  - name: ExternalAlt
    description: Alternative documented external feedback encoding.
    value: 1
  - name: Pga
    description: Internal positive gain network.
    value: 2
  - name: Follower
    description: Internal voltage follower.
    value: 3
enum/Gain:
  bit_size: 3
  variants:
  - name: Mul2
    description: Gain 2.
    value: 0
  - name: Mul4
    description: Gain 4.
    value: 1
  - name: Mul8
    description: Gain 8.
    value: 2
  - name: Mul16
    description: Gain 16.
    value: 3
  - name: Mul32
    description: Gain 32.
    value: 4
enum/Bias:
  bit_size: 3
  variants:
  - name: Ua1
    description: 1 microampere bias current.
    value: 0
  - name: Ua2
    description: 2 microampere bias current.
    value: 1
  - name: Ua3
    description: 3 microampere bias current.
    value: 2
  - name: Ua4
    description: 4 microampere bias current.
    value: 3
  - name: Ua5
    description: 5 microampere bias current.
    value: 4
  - name: Ua6
    description: 6 microampere bias current.
    value: 5
  - name: Ua7
    description: 7 microampere bias current.
    value: 6
  - name: Ua8
    description: 8 microampere bias current.
    value: 7
enum/CalibrationMode:
  bit_size: 1
  variants:
  - name: Triggered
    description: Software or hardware triggered calibration.
    value: 0
  - name: Level
    description: Level calibration controlled by START.
    value: 1
