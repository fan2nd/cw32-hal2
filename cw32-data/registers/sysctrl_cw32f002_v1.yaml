enum/Sysclk:
  description: CW32F002 own RM Rev 1.4 PDF p54; direct system sources, other codes reserved. See cw32-data/hex-qualified.yaml.
  bit_size: 3
  variants:
  - name: HSI
    description: Divided internal high-speed oscillator.
    value: 0
  - name: HEX
    description: External clock input selected by HEX.PINMUX.
    value: 1
  - name: LSI
    description: Internal low-speed oscillator.
    value: 3
enum/HexInput:
  description: CW32F002 own RM Rev 1.4 PDF p57; selectable external input pads, neither is a crystal output.
  bit_size: 1
  variants:
  - name: PB0
    description: External clock input from PB00.
    value: 0
  - name: PB1
    description: External clock input from PB01.
    value: 1
