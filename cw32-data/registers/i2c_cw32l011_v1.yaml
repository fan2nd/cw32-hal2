enum/Status:
  description: I2C STAT encodings verified in every own-family manual; see docs/i2c-typed-register-evidence.json.
  bit_size: 8
  variants:
  - name: BUS_ERROR
    description: Bus error or an undefined state caused by interference.
    value: 0
  - name: START
    description: START transmitted.
    value: 8
  - name: REPEATED_START
    description: Repeated START transmitted.
    value: 16
  - name: WRITE_ADDRESS_ACK
    description: SLA+W transmitted; ACK received.
    value: 24
  - name: WRITE_ADDRESS_NACK
    description: SLA+W transmitted; NACK received.
    value: 32
  - name: WRITE_DATA_ACK
    description: Data byte transmitted; ACK received.
    value: 40
  - name: WRITE_DATA_NACK
    description: Data byte transmitted; NACK received.
    value: 48
  - name: ARBITRATION_LOST
    description: Arbitration lost while transmitting an address, data, or NACK.
    value: 56
  - name: READ_ADDRESS_ACK
    description: SLA+R transmitted; ACK received.
    value: 64
  - name: READ_ADDRESS_NACK
    description: SLA+R transmitted; NACK received.
    value: 72
  - name: READ_DATA_ACK
    description: Data byte received; ACK returned.
    value: 80
  - name: READ_DATA_NACK
    description: Data byte received; NACK returned.
    value: 88
  - name: SLAVE_WRITE_ADDRESS
    description: Own SLA+W received; ACK returned.
    value: 96
  - name: ARBITRATION_LOST_SLAVE_WRITE
    description: Arbitration lost; own SLA+W received; ACK returned.
    value: 104
  - name: GENERAL_CALL_ADDRESS
    description: General-call address received; ACK returned.
    value: 112
  - name: ARBITRATION_LOST_GENERAL_CALL
    description: Arbitration lost; general-call address received; ACK returned.
    value: 120
  - name: SLAVE_WRITE_DATA_ACK
    description: Own-address data byte received; ACK returned.
    value: 128
  - name: SLAVE_WRITE_DATA_NACK
    description: Own-address data byte received; NACK returned.
    value: 136
  - name: GENERAL_CALL_DATA_ACK
    description: General-call data byte received; ACK returned.
    value: 144
  - name: GENERAL_CALL_DATA_NACK
    description: General-call data byte received; NACK returned.
    value: 152
  - name: SLAVE_STOP_OR_RESTART
    description: STOP or repeated START received while addressed as a slave.
    value: 160
  - name: SLAVE_READ_ADDRESS
    description: Own SLA+R received; ACK returned.
    value: 168
  - name: ARBITRATION_LOST_SLAVE_READ
    description: Arbitration lost; own SLA+R received; ACK returned.
    value: 176
  - name: SLAVE_READ_DATA_ACK
    description: Slave data byte transmitted; ACK received.
    value: 184
  - name: SLAVE_READ_DATA_NACK
    description: Slave data byte transmitted; NACK received.
    value: 192
  - name: SLAVE_READ_LAST_DATA_ACK
    description: Last slave data byte transmitted; ACK received.
    value: 200
  - name: NO_INFORMATION
    description: No relevant status information; SI is clear.
    value: 248
