enum/Over:
  description: UART OVER encodings; see docs/uart-typed-registers.md for own-manual
    evidence.
  bit_size: 2
  variants:
  - name: OVER16
    description: Sixteen samples per bit.
    value: 0
  - name: OVER8
    description: Eight samples per bit.
    value: 1
  - name: OVER4
    description: Four samples per bit.
    value: 2
  - name: SPECIAL
    description: Dedicated low-speed sampling.
    value: 3
enum/Stop:
  description: UART STOP encodings; see docs/uart-typed-registers.md for own-manual
    evidence.
  bit_size: 2
  variants:
  - name: STOP1
    description: One stop bit.
    value: 0
  - name: STOP1P5
    description: One and a half stop bits.
    value: 1
  - name: STOP2
    description: Two stop bits.
    value: 2
enum/Parity:
  description: UART PARITY encodings; see docs/uart-typed-registers.md for own-manual
    evidence.
  bit_size: 2
  variants:
  - name: NONE
    description: No parity.
    value: 0
  - name: CUSTOM
    description: User-defined parity.
    value: 1
  - name: EVEN
    description: Even parity.
    value: 2
  - name: ODD
    description: Odd parity.
    value: 3
enum/Source:
  description: UART SOURCE encodings; see docs/uart-typed-registers.md for own-manual
    evidence.
  bit_size: 2
  variants:
  - name: PCLK
    description: Peripheral clock.
    value: 0
  - name: PCLK_ALT
    description: Peripheral clock, alternate encoding.
    value: 1
  - name: LSE
    description: External low-speed clock.
    value: 2
  - name: LSI
    description: Internal low-speed clock.
    value: 3
