enum/CcMode:
  description: Classic capture/compare modes; own-manual evidence in docs/classic-gtim-modes-evidence.json.
  bit_size: 4
  variants:
  - name: DISABLED
    description: No capture or compare function.
    value: 0
  - name: CAPTURE_RISING
    description: Capture on rising edges.
    value: 1
  - name: CAPTURE_FALLING
    description: Capture on falling edges.
    value: 2
  - name: CAPTURE_BOTH
    description: Capture on both rising and falling edges.
    value: 3
  - name: FORCE_LOW
    description: Force the output low.
    value: 8
  - name: FORCE_HIGH
    description: Force the output high.
    value: 9
  - name: COMPARE_LOW
    description: Drive the output low on a compare match.
    value: 10
  - name: COMPARE_HIGH
    description: Drive the output high on a compare match.
    value: 11
  - name: PWM_HIGH_AT_OR_ABOVE
    description: PWM output high when CNT is greater than or equal to CCR.
    value: 14
  - name: PWM_HIGH_BELOW
    description: PWM output high when CNT is less than CCR.
    value: 15
enum/Mode:
  description: Basic timer mode when ENCMODE is zero; own-manual evidence in docs/classic-gtim-modes-evidence.json.
  bit_size: 2
  variants:
  - name: TIMER
    description: Count PCLK ticks.
    value: 0
  - name: COUNTER
    description: Count TRS input events.
    value: 1
  - name: TRIGGER_START
    description: Count PCLK ticks; a valid TRS event can start the timer.
    value: 2
  - name: GATED
    description: Count PCLK ticks while enabled and ETR is at the active level selected by POL.
    value: 3
