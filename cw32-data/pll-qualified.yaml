qualification_policy: Entire actual input envelope and entire multiplied output envelope must each fit
  one documented analog frequency bin, with independent electrical and final bus limits. These are current
  qualification choices, not declarations that other hardware settings are invalid. Each family owns its
  HSI-pair list and actual bounds. Choose the first (lowest encoding) analog bin containing the full closed
  envelope; use encoding4 for the final output bin.
limitations:
- Cycle-to-cycle jitter is not an absolute period or phase bound. The multiplied source envelope is a
  rate qualification only.
- No runtime retuning, independent PLL, DeepSleep restore or guaranteed fault recovery.
- Crystal admission follows the vendor-documented functional composition; hidden-node numeric duty is not independently certified.
- Bypass OSC_IN must meet the existing waveform limits including 40-60% duty; all PLL outputs remain rate-only.
- Ordinary peripheral, DMA, IRQ/NMI, MCO and dedicated PLL_OUT users must be quiescent at entry.
discrepancies:
- Datasheet output8-48MHz (F020) or8-64MHz (L083/F030/A030) and manual12-72MHz analog bins are intersected
  independently to12-48MHz or12-64MHz. Outputs below12MHz remain unqualified.
- SDK whole-register PLL writes omit reserved debug default0x5; use typed modify preserving inherited
  defaults.
- F020/x030 SVDs inherit reset0 but own manuals explicitly specify PLL reset0x00053483. F020 SVD RFU19:16
  is renamed RESERVED_DEBUG; x030 SVD omits it. Both are modeled only to preserve/check the manual default0x5,
  not to make reserved controls configurable.
