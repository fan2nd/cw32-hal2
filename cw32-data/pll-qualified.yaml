limitations:
- Cycle-to-cycle jitter is not an absolute period or phase bound. The multiplied source envelope is a
  rate qualification only.
- No HSE-fed PLL, runtime retuning, DeepSleep restore or guaranteed fault recovery.
- Ordinary peripheral, DMA, IRQ/NMI, MCO and dedicated PLL_OUT users must be quiescent at entry.
discrepancies:
- Datasheet 8-64 MHz output and manual 12-72 MHz analog bins are intersected to 12-64 MHz.
- SDK whole-register PLL writes omit reserved debug default0x5; use typed modify preserving inherited
  defaults.
