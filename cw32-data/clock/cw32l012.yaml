      claim: Complete APBRST1 bit macro inventory.
    - source_id: cw32l012_h
      locator: lines 8349-8368
      claim: Complete APBRST2 bit macro inventory.
  blockers:
  - No dedicated SYSCTRL gate/reset field for this peripheral name in the complete six enable/reset register
    fieldsets; cannot synthesize a gate or silently treat it as another module.
  - Functional kernel clock is not established.
  notes:
  - Core/system or analog helper block has no independently identified SYSCTRL gate; upstream Rcc requires
    a gate and cannot represent an ungated peripheral.
