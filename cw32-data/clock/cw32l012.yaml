stop_mode_policy:
  value: Stop1
  basis: conservative-build-policy
  reason: Use the most conservative upstream StopMode limit until a CW32-specific low-power policy is
    verified. CW32 Sleep/DeepSleep is not STM32 Stop1/Stop2.
peripherals:
- name: ADC1
  status: supported
  reset_status: verified-field
  evidence:
    enable:
    - source_id: cw32l012_h
      locator: lines 8277-8278
      claim: APBEN1.ADC is the enable bit at position 0.
    reset:
    - source_id: cw32l012_h
      locator: lines 8346-8347
      claim: APBRST1.ADC is the reset bit at position 0.
    bus_clock:
    - source_id: cw32l012_datasheet_cn_v1_0_pdf
      locator: PDF page 15, Figure 4-1 clock tree (visually verified)
      claim: HCLK feeds AHB group; PCLK feeds APB group; separate functional clocks are drawn separately.
    enable_active_value:
    - source_id: cw32l012_sysctrl_h
      locator: lines 460-460
      claim: Enable operation sets APBEN1.ADC.
    enable_write_key:
    - source_id: cw32l012_sysctrl_h
      locator: lines 69-69
      claim: Clock writes require 0x5A5A in the upper KEY halfword.
    - source_id: cw32l012_sysctrl_h
      locator: lines 460-460
      claim: Enable operation sets APBEN1.ADC.
    reset_asserted_value:
    - source_id: cw32l012_usermanual_cn_v1_4_txt
      locator: lines 3789-3854
      claim: Reset register chapter states 0 holds module in reset; 1 permits normal operation.
    shared_controller:
    - source_id: cw32l012_adc_c
      locator: lines 88-98
      claim: ADC instance initialization uses the single ADC controller gate.
    kernel_clock:
    - source_id: cw32l012_datasheet_cn_v1_0_pdf
      locator: PDF page 15, Figure 4-1 clock tree (visually verified)
      claim: HCLK feeds AHB group; PCLK feeds APB group; separate functional clocks are drawn separately.
    - source_id: cw32l012_adc_h
      locator: lines 174-182
      claim: ADC local prescaler divides the PCLK input; this is a divider, not an oscillator mux.
    - source_id: cw32l012_usermanual_cn_v1_4_txt
      locator: lines 27727-27729
      claim: Manual explicitly identifies PCLK as ADC upstream source.
    shared_enable_group:
    - source_id: cw32l012_adc_c
      locator: lines 88-98
      claim: ADC instance initialization uses the single ADC controller gate.
    shared_reset_group:
    - source_id: cw32l012_adc_c
      locator: lines 88-98
      claim: ADC instance initialization uses the single ADC controller gate.
  blockers: []
  notes:
  - Clock-gate writes require KEY=0x5A5A; upstream Rcc field identity alone does not describe this protocol.
  - ADC1 uses shared controller gate/reset ADC; do not reset it while another member is active.
  enable:
    peripheral: SYSCTRL
    register: APBEN1
    field: ADC
  reset:
    peripheral: SYSCTRL
    register: APBRST1
    field: ADC
  enable_active_value: 1
  bus_clock: PCLK
  enable_write_key:
    field:
      peripheral: SYSCTRL
      register: APBEN1
      field: KEY
    value: 23130
  reset_asserted_value: 0
  kernel_clock:
    clock: PCLK
  shared_enable_group: ADC1-ADC2
  shared_reset_group: ADC1-ADC2
