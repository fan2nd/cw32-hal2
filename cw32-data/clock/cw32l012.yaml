- name: BGR
  status: partial
  reset_status: not-established
  evidence:
    controller_inventory:
    - source_id: cw32l012_h
      locator: lines 8230-8249
      claim: Complete AHBEN bit macro inventory.
    - source_id: cw32l012_h
      locator: lines 8251-8278
