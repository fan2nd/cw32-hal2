stop_mode_policy:
  value: Stop1
  basis: conservative-build-policy
  reason: Use the most conservative upstream StopMode limit until a CW32-specific low-power policy is
    verified. CW32 Sleep/DeepSleep is not STM32 Stop1/Stop2.
peripherals:
- name: ADC
  status: supported
  bus_clock: PCLK
  kernel_clock:
    clock: PCLK
  enable:
    peripheral: SYSCTRL
    register: APBEN2
    field: ADC
  reset:
    peripheral: SYSCTRL
    register: APBRST2
    field: ADC
  reset_status: verified-field
  enable_active_value: 1
  reset_asserted_value: 0
  evidence:
    enable:
    - source_id: cw32f002/Libraries/inc/cw32f002.h
      locator: lines 3848-3849
      claim: SYSCTRL.APBEN2.ADC is bit 2.
    - source_id: CW32F002_UserManual_CN_V1.4.txt
      locator: lines 2518-2522
      claim: 'SYSCTRL.APBEN2.ADC: 0 disables the configuration clock, 1 enables it.'
    reset:
    - source_id: cw32f002/Libraries/inc/cw32f002.h
      locator: lines 3883-3884
      claim: SYSCTRL.APBRST2.ADC is bit 2.
    - source_id: CW32F002_UserManual_CN_V1.4.txt
      locator: lines 2650-2654
      claim: 'SYSCTRL.APBRST2.ADC: 0 holds module in reset, 1 allows normal operation.'
    bus_clock:
    - source_id: CW32F002_UserManual_CN_V1.4.txt
      locator: lines 1519-1524
      claim: HCLK is the high-performance-bus source used for configuration and work; PCLK is derived
        from HCLK for timers, SPI and I2C.
    - source_id: CW32F002_UserManual_CN_V1.4.txt
      locator: lines 781-829
      claim: Vendor bus architecture directly identifies AHB and APB-connected blocks.
    - source_id: CW32F002_UserManual_CN_V1.4.txt
      locator: lines 2518-2522
      claim: 'SYSCTRL.APBEN2.ADC: 0 disables the configuration clock, 1 enables it.'
    kernel_clock:
    - source_id: CW32F002_UserManual_CN_V1.4.txt
      locator: lines 13613-13616
      claim: ADC source is PCLK before the ADC_CR0.CLK prescaler.
    kernel_prescaler:
    - source_id: CW32F002_UserManual_CN_V1.4.txt
      locator: lines 13613-13616
      claim: ADC source is PCLK before the ADC_CR0.CLK prescaler.
    enable_active_value:
    - source_id: CW32F002_UserManual_CN_V1.4.txt
      locator: lines 2518-2522
      claim: 'SYSCTRL.APBEN2.ADC: 0 disables the configuration clock, 1 enables it.'
    reset_asserted_value:
    - source_id: CW32F002_UserManual_CN_V1.4.txt
      locator: lines 2650-2654
      claim: 'SYSCTRL.APBRST2.ADC: 0 holds module in reset, 1 allows normal operation.'
  blockers: []
  notes:
  - Clock denotes PCLK input; actual ADCCLK is PCLK divided by ADC.CR0.CLK.
  related_fields:
  - role: kernel_prescaler
    field:
      peripheral: ADC
      register: CR0
      field: CLK
