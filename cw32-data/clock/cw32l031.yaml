stop_mode_policy:
  value: Stop1
  basis: conservative-build-policy
  reason: Use the most conservative upstream StopMode limit until a CW32-specific low-power policy is
    verified. CW32 Sleep/DeepSleep is not STM32 Stop1/Stop2.
