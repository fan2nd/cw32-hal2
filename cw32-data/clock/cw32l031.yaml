- name: ADC
  status: supported
  reset_status: verified-field
  evidence:
    enable:
    - source_id: cw32l031_h
      locator: lines 5837-5838
      claim: APBEN2.ADC is the enable bit at position 2.
    reset:
    - source_id: cw32l031_h
      locator: lines 5884-5885
      claim: APBRST2.ADC is the reset bit at position 2.
    bus_clock:
    - source_id: cw32l031_datasheet_cn_v1_9_pdf
      locator: PDF page 14, Figure 4-1 clock tree (visually verified)
      claim: HCLK feeds AHB group; PCLK feeds APB group; separate functional clocks are drawn separately.
    enable_active_value:
    - source_id: cw32l031_rcc_h
      locator: lines 330-330
      claim: Enable operation sets APBEN2.ADC.
    reset_asserted_value:
    - source_id: cw32l031_usermanual_cn_v1_6_txt
      locator: lines 3481-3546
      claim: Reset register chapter states 0 holds module in reset; 1 permits normal operation.
    kernel_clock:
    - source_id: cw32l031_datasheet_cn_v1_9_pdf
      locator: PDF page 14, Figure 4-1 clock tree (visually verified)
      claim: HCLK feeds AHB group; PCLK feeds APB group; separate functional clocks are drawn separately.
    - source_id: cw32l031_adc_h
      locator: lines 158-166
      claim: ADC local prescaler divides the PCLK input; this is a divider, not an oscillator mux.
    - source_id: cw32l031_usermanual_cn_v1_6_txt
      locator: lines 20102-20104
      claim: Manual explicitly identifies PCLK as ADC upstream source.
  blockers: []
  notes: []
  enable:
    peripheral: SYSCTRL
    register: APBEN2
    field: ADC
  reset:
    peripheral: SYSCTRL
    register: APBRST2
    field: ADC
  enable_active_value: 1
  bus_clock: PCLK
  reset_asserted_value: 0
  kernel_clock:
    clock: PCLK
