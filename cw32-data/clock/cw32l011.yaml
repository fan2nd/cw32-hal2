limitations:
- All verified SYSCTRL peripheral-reset controls assert low (write 0) and release high (write 1). Upstream
  Rcc field references cannot encode polarity; consumers must read this sidecar rather than use active-high
  STM32 reset assumptions.
- APBEN1/APBEN2 are register banks for one PCLK, not evidence for PCLK1/PCLK2.
- Scoped peripheral-local muxes cannot be represented faithfully by upstream unscoped Rcc::Mux Field.
  Such records are partial and must not be emitted with a fabricated fixed PCLK.
- Kernel fixed-clock facts denote input source before peripheral prescalers, baud dividers, timer count-mode
  routing, or optional digital filters; they are not guaranteed counter/output frequencies.
- CW32 documents Sleep and DeepSleep; upstream Stop1/Stop2/Standby enum is not directly vendor-backed.
  Apply an explicitly documented conservative software policy if emitting Rcc.
- Shared gates/reset lines require shared ownership or reference counting. Resetting one member can affect
  all members.
- SYSCTRL AHBEN/APBEN gate writes require KEY=0x5A5A in bits31:16; upstream Rcc.enable cannot encode this
  write protocol. See each enable_write_key fact.
- All APB gate registers use the single PCLK; APBEN1/APBEN2 are register banks, not evidence for distinct
  PCLK1/PCLK2.
- 'StopMode is deliberately omitted: Sleep/DeepSleep behavior is clock-source dependent and upstream Stop1
  requires explicit conservative build policy.'
- Supported indicates bus/kernel upstream source plus gate/reset field identities; sidecar gate-key and
  active-low reset semantics remain mandatory consumer considerations.
