stop_mode_policy:
  value: Stop1
  basis: conservative-build-policy
  reason: Use the most conservative upstream StopMode limit until a CW32-specific low-power policy is
    verified. CW32 Sleep/DeepSleep is not STM32 Stop1/Stop2.
peripherals:
- name: ADC
  status: supported
  reset_status: verified-field
  evidence:
    enable:
    - source_id: cw32l052_h
      locator: lines 7855-7856
      claim: APBEN2.ADC is the enable bit at position 2.
    reset:
    - source_id: cw32l052_h
      locator: lines 7914-7915
      claim: APBRST2.ADC is the reset bit at position 2.
    bus_clock:
    - source_id: cw32l052_datasheet_cn_v1_3_pdf
      locator: PDF page 14, Figure 4-1 clock tree (visually verified)
      claim: HCLK feeds AHB group; PCLK feeds APB group; separate functional clocks are drawn separately.
    enable_active_value:
    - source_id: cw32l052_rcc_h
      locator: lines 350-350
      claim: Enable operation sets APBEN2.ADC.
    reset_asserted_value:
    - source_id: cw32l052_usermanual_cn_v1_5_txt
      locator: lines 3740-3805
      claim: Reset register chapter states 0 holds module in reset; 1 permits normal operation.
    kernel_clock:
    - source_id: cw32l052_datasheet_cn_v1_3_pdf
      locator: PDF page 14, Figure 4-1 clock tree (visually verified)
      claim: HCLK feeds AHB group; PCLK feeds APB group; separate functional clocks are drawn separately.
    - source_id: cw32l052_adc_h
      locator: lines 164-172
      claim: ADC local prescaler divides the PCLK input; this is a divider, not an oscillator mux.
    - source_id: cw32l052_usermanual_cn_v1_5_txt
      locator: lines 21998-22000
      claim: Manual explicitly identifies PCLK as ADC upstream source.
  blockers: []
  notes: []
  enable:
    peripheral: SYSCTRL
    register: APBEN2
    field: ADC
  reset:
    peripheral: SYSCTRL
    register: APBRST2
    field: ADC
  enable_active_value: 1
  bus_clock: PCLK
  reset_asserted_value: 0
  kernel_clock:
    clock: PCLK
