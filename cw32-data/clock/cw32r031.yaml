- name: ADC
  status: supported
  bus_clock: PCLK
  kernel_clock:
    clock: PCLK
  enable:
    peripheral: SYSCTRL
    register: APBEN2
    field: ADC
  reset:
    peripheral: SYSCTRL
    register: APBRST2
    field: ADC
  reset_status: verified-field
  enable_active_value: 1
  reset_asserted_value: 0
  evidence:
    enable:
    - source_id: cw32r031/Libraries/inc/cw32r031.h
      locator: lines 5837-5838
      claim: SYSCTRL.APBEN2.ADC is bit 2.
    - source_id: CW32R031_UserManual_CN_V1.3.txt
      locator: lines 3488-3492
      claim: 'SYSCTRL.APBEN2.ADC: 0 disables the configuration clock, 1 enables it.'
    reset:
    - source_id: cw32r031/Libraries/inc/cw32r031.h
      locator: lines 5884-5885
      claim: SYSCTRL.APBRST2.ADC is bit 2.
    - source_id: CW32R031_UserManual_CN_V1.3.txt
      locator: lines 3642-3646
      claim: 'SYSCTRL.APBRST2.ADC: 0 holds module in reset, 1 allows normal operation.'
    bus_clock:
    - source_id: CW32R031_UserManual_CN_V1.3.txt
      locator: lines 1868-1873
      claim: HCLK is the high-performance-bus source used for configuration and work; PCLK is derived
        from HCLK for timers, SPI and I2C.
    - source_id: CW32R031_UserManual_CN_V1.3.txt
      locator: lines 1049-1097
      claim: Vendor bus architecture directly identifies AHB and APB-connected blocks.
    - source_id: CW32R031_UserManual_CN_V1.3.txt
      locator: lines 3488-3492
      claim: 'SYSCTRL.APBEN2.ADC: 0 disables the configuration clock, 1 enables it.'
    kernel_clock:
    - source_id: CW32R031_UserManual_CN_V1.3.txt
      locator: lines 20210-20213
      claim: ADC source is PCLK before the ADC_CR0.CLK prescaler.
    kernel_prescaler:
    - source_id: CW32R031_UserManual_CN_V1.3.txt
      locator: lines 20210-20213
      claim: ADC source is PCLK before the ADC_CR0.CLK prescaler.
    enable_active_value:
    - source_id: CW32R031_UserManual_CN_V1.3.txt
      locator: lines 3488-3492
      claim: 'SYSCTRL.APBEN2.ADC: 0 disables the configuration clock, 1 enables it.'
    reset_asserted_value:
    - source_id: CW32R031_UserManual_CN_V1.3.txt
      locator: lines 3642-3646
      claim: 'SYSCTRL.APBRST2.ADC: 0 holds module in reset, 1 allows normal operation.'
  blockers: []
  notes:
  - Clock denotes PCLK input; actual ADCCLK is PCLK divided by ADC.CR0.CLK.
  related_fields:
  - role: kernel_prescaler
    field:
      peripheral: ADC
      register: CR0
      field: CLK
