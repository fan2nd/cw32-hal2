field_width_overrides:
- block: VC2REF
  fieldset: REF
  field: DIV
  expected_bit_offset: 0
  expected_bit_size: 3
  bit_size: 4
  evidence: 'CW32L012 User Manual CN V1.4 sections 27.7.1 and 27.7.2, printed page 627/PDF page 653:
    both VCREF divider fields are DIV[3:0]. Section 27.3.1, printed page 620/PDF page 646, only
    qualifies codes 0..7; SDK V1.0.5 and SVD use three bits. PAC follows the four-bit manual field;
    HAL rejects inherited codes 8..15 and writes only 0..7. See cw32-data/reference-dividers.yaml
    and docs/comparator-reference.md. PDF SHA256 a9e54694a26f03c1f3e3041f40844900168ca2b8e6142f3328671b92e6b7a340.
