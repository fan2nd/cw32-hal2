register_overrides:
- block: ADC
  register: ISR
  expected_access: ReadWrite
  access: Read
  evidence: 'CW32L012 User Manual CN V1.4 section 25.12.9, printed page 597/PDF page 623: ADC ISR at offset
    0x78 marks every defined status field RO; flags clear through the separate ICR. Access-only correction;
    widths, offsets and fields unchanged. PDF SHA256 a9e54694a26f03c1f3e3041f40844900168ca2b8e6142f3328671b92e6b7a340.
    https://www.whxy.com/uploads/files/20260603/CW32L012_UserManual_CN_V1.4.pdf'
