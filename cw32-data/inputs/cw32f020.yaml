source_notes:
- SVD correctly exposes two DMA channels. Vendor header erroneously defines channels3-5. CW32F020 User
  Manual CN V1.4 section8.2 p122 and section8.7 p134 confirm only two.
- F020 CRC has eight CRC16 modes only (0-7), unlike copied SDK/SVD CRC32 declarations. The CRC32-named
  result register is retained solely as a 32-bit bus view with a corrected 16-bit valid field; see docs/f020-serial-compatibility.md.
  CR.MODE retains its documented 4-bit layout; values8-15 remain unsupported. DR8/DR16/DR32 input widths
  are all documented.
