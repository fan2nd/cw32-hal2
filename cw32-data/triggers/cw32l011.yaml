limitations:
- Exactly these two internal paths are qualified. No universal ITR numbers, reserved, self-feedback or
  conflicted routes.
- Runtime uses static HAL resource ownership; public PAC writes remain an explicit outside-HAL concurrency
  boundary.
- ADC runtime is one-shot hardware-triggered sampling, not periodic lossless acquisition.
- No silicon execution or timing validation.
- Disarm/timeout is terminal for the ADC owner; no immediate abort or trigger-pipeline drain guarantee.
- Cascade stop disables BTIM2 before SMS=0, and detaches BTIM2 before stopping the producer. No atomic
  cutoff or maximum lossless trigger rate is established.
