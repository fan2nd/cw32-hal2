qualification:
  frequency_conflict: Own RMs require actual 4..32 MHz; own DS external-input tables state 1..32 MHz.
    Admit their intersection 4..32 MHz including complete board-guaranteed minimum and maximum, never
    nominal frequency alone.
  conditions: Use own general supply 1.65..5.5 V and conservative ambient -40..105 C. The conditional
    low-power 125 C extension is not adopted; retained factory HSI is qualified only through 105 C.
  waveform: All waveform limits apply together at the pad. Duty is 40..60 percent; each high/low pulse
    is at least 15 ns; each rise/fall is at most 20 ns. At 32 MHz, 40 percent gives 12.5 ns and is therefore
    insufficient. DS waveform characteristics are guaranteed by design, not production-tested.
  levels: high_level_vddio_percent is 70..100; low_level_vddio_percent is 0..30, where 0 denotes VSS and
    percentages are relative to VSS. Own I/O and absolute-maximum limits also apply.
  accuracy: No default ppm or inherited HSI accuracy. Board guarantees include temperature, supply, aging,
    load and short-term cycle variation across declared operating conditions.
  pins: Own datasheet Table 5-2 labels HEX_PB00 and HEX_PB01 in PB00/PB01 rows. These reviewed routes
    are peripheral-controlled inputs without numbered AFs. Existing independently reviewed physical pinouts
    determine exact-package availability; aliases retain the common GPIO intersection. Physical pinout
    catalogs are unchanged.
  clock_loss: STABLE is a startup latch, not continuous clock-loss detection. No usable CCS, automatic
    fallback or PLL mechanism is documented for this pair; copied SDK CCS/LSELOCK helpers do not authorize
    writes to reserved CR1 bits.
  retained_awt: AWT SRC=2/3 independently selects PB00/PB01. HEXEN=0 or a different system PINMUX does
    not prove the other AWT input pad is unused.
