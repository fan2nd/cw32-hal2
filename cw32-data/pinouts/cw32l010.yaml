notes:
- Package pins retain physical position strings, including vendor-numbered exposed pads. A dash in the
  source is unbonded and becomes null only in table_rows; it is never emitted as a package pin.
- GPIO names are normalized by removing leading zeroes (PA00 to PA0). Other pin labels preserve source
  spelling. Direct pin-name aliases and OSC/OSC32 analog aliases are included; numbered alternate-function
  routing is outside this dataset.
- gpio_pins lists output-capable MCU GPIO pins according to this family's pin-type table, including debug/reset
  pads that require explicit reconfiguration. input_only_pins contains MCU GPIO names only. Neither list
  claims safe electrical configuration or silicon verification.
- Unnumbered thermal pads are not assigned invented positions or signals. Numbered pad 0 is included only
  where explicitly documented.
- PB7/NRST is input-only even when reset is disabled through SYSCTRL_CR2.RSTIO. SWD uses PA7 and PA8.
  OSC32_OUT is PB0 and OSC32_IN is PB1.
