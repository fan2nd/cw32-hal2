l012_div_width_conflict:
  manual: CN Rev1.4 physical PDF page653, printed627, sections27.7.1 and27.7.2 render
    DIV[3:0]. Functional section27.3.1 printed620 permits only codes0..7.
  sdk: V1.0.5 cw32l012.h VCREF_DIV_DIV_Msk=0x7 and three-bit DIV member; cw32l012_vc.h
    VC_Divider lists0..7.
  resolution: PAC models four-bit field from own manual. HAL only writes documented
    codes0..7 and rejects inherited codes8..15 before any reference write, preserving
    uncertain bit3. No ratio is asserted for codes8..15.
startup: No independent guaranteed divider settling maximum/readiness flag was found.
  Comparator Readiness remains Unknown. Core rail is nominal, not a calibrated reference.
  Board must qualify analog settling.
electrical: Own-family comparator supply/input ranges apply; Vcore input does not
  relax them. VDDA=VDD where VDDA exists. No reference output pin or programmable
  BGR voltage is exposed.
