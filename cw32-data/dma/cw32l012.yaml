unknowns:
- The HARDSRC table labels request 18 only HALLTIM. EVENT preserves that generic source without inventing
  a more specific Hall event.
request_register:
  peripheral_kind: dmachannel
  register: TRIG
  field: HARDSRC
  bit_offset: 2
  bit_size: 6
normalization:
  channel_index: Zero-based upstream channel index; physical_channel is the one-based vendor ordinal.
  request: Unshifted six-bit HARDSRC value, not the SDK macro value shifted left by two.
  irq: CMSIS/generated interrupt spelling; the manual abbreviates DMACH as DMA.
  signals: UART/SPI/I2C TX/RX; timer UP/TRIG/CHn; grouped ATIM sources remain grouped; ADC COMPLETE or
    SEQ/SINGLE matches the manual wording.
  dmamux: 'No separate DMAMUX instance: request selection is internal to each DMA channel.'
  aliases: SDK LPI2C1/2 maps to manual and generated I2C1/2; manual DAC1/2 are channels 1/2 of generated
    DAC, not separate peripherals.
