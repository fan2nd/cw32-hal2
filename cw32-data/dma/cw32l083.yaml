evidence:
  software_block_copy:
    source: manual
    section: 8.4.1-8.4.2, 8.5
    pdf_page_indices: [136, 137, 138, 142]
    printed_pages: [136, 137, 138, 142]
    interpretation: Software BLOCK uses matching 8/16/32-bit widths, REPEAT=1, count 1..65535, EN then SOFTSRC.
  successful_copy_completion:
    source: manual
    section: 8.6, 8.8.3, 8.8.4
    pdf_page_indices: [143, 147, 149]
    printed_pages: [143, 147, 149]
    interpretation: TC means all data transferred correctly; release owned resources only for TC without TE, STATUS=5, and SOFTSRC=0. EN-clear or TE is not documented as bus drain.
  software_copy_sram:
    source: manual
    section: 2.3, 6.1-6.3
    pdf_page_indices: [32, 114, 115]
    printed_pages: [32, 114, 115]
    interpretation: DMA can access SRAM in aligned 8/16/32-bit widths; exact capacity comes from parts.yaml and each selected generated memory map.
  controller_shared_gate:
    source: manual
    section: 4.7.12, 4.7.15
    pdf_page_indices: [85, 89]
    printed_pages: [85, 89]
    interpretation: AHBEN.DMA is the shared enable and AHBRST.DMA the shared active-low reset; use central RCC controls without channel-local reset or gate disable.
  staged_hardware_block:
    source: manual
    section: 8.4.4, 8.5, 8.6, 8.8.3-8.8.4
    pdf_page_indices: [140, 142, 143, 147, 148, 149]
    printed_pages: [140, 142, 143, 147, 148, 149]
    interpretation: UART1-6 and SPI1-2 RX/TX are qualified for static staged byte BLOCK requests on all five channels. TC without TE plus STATUS=5 permits retirement after peripheral request closure; SOFTSRC is not hardware completion evidence. Other L083 routes are outside this HAL subset.
  staged_uart:
    source: manual
    section: 5.4, 19.3.3.4, 19.5-19.7.1.6, 19.9.9
    pdf_page_indices: [105, 378, 383, 384, 389, 390, 400]
    printed_pages: [105, 378, 383, 384, 389, 390, 400]
    interpretation: Byte TX/RX enables the channel before DMATX/DMARX and closes the request after TC. TX additionally waits TXBUSY for wire idle. UART1/4, 2/5 and 3/6 share vectors. FE/PE and overwrite without overrun reporting require finite-chunk loss caveats and retained unresolved leases.
  staged_spi:
    source: manual
    section: 20.3.9-20.6.1.3, 20.8.5-20.8.7
    pdf_page_indices: [415, 416, 417, 420, 421, 431, 432]
    printed_pages: [415, 416, 417, 420, 421, 431, 432]
    interpretation: Master byte DMA uses paired TX/RX descriptors and both clean terminals, closes both requests, then waits BUSY=0 before CS release. MODF/OV/SSERR/UD do not prove DMA drain; errors retain the pair. Existing 12MHz/divisor-4 minimum SPI clock policy remains authoritative.
  channel_count:
    source: manual
    section: '8.2'
    pdf_page_indices:
    - 134
    printed_pages:
    - 134
  request_table:
    source: manual
    section: 8.8.4, DMA_TRIGy.HARDSRC[7:2]
    pdf_page_indices:
    - 148
    - 149
    printed_pages:
    - 148
    - 149
  channel_constraint:
    source: manual
    section: 8.8.4
    pdf_page_indices:
    - 147
    printed_pages:
    - 147
    interpretation: One common HARDSRC table applies to every channel y=1~5; no channel-specific restriction
      is documented.
  interrupts:
    source: manual
    section: 5.4, Table 5-1
    pdf_page_indices:
    - 104
    printed_pages:
    - 104
