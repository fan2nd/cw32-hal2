    qualification:
      conditions: Own DS Table7-4 printed31/PDF32 qualifies VDD1.62..5.5V; actual HCLK/PCLK<=24MHz below1.8V
        and<=48MHz otherwise. Retained factory HSIOSC48MHz+/-2% means47.04..48.96MHz; own Table7-18 printed42/PDF43
        keeps the combined ambient range-40..85C. Flash WAIT0/1 covers actual HCLK<=24/48MHz (own RM printed113/PDF114).
      bypass_coverage: Own RM printed49/PDF50 and DS Table7-14 printed38/PDF39 both support1..32MHz bypass.
        This initial implementation deliberately admits only actual4..32MHz for the bounded detector/startup
        policy. The excluded1..<4MHz band is deferred software coverage, not a hardware limitation or source
        conflict.
      lsi_bound: Own RM printed55/PDF56 permits legal LSI32.8kHz+/-10%, yielding36080Hz maximum. Own DS Table7-19
        printed42/PDF43 factory+/-3% is narrower and must not be assigned to arbitrary inherited trim. Retained
        LSI must already be legally operating and unchanged.
      pins: 'Own DS Table5-2 printed23/PDF24: PA00=OSC_IN and PA01=OSC_OUT are TTa. CW32L010F8P6/TSSOP20 pins5/6;
        CW32L010F8U6/QFN20 pins2/3; CW32L010Y8M6/SOP16 pins4/5. The SOP16 diagram printed22/PDF23 independently
        agrees.'
      hsi_divider: Own HSI DIV code0=/16; codes1..15=/1..15. Reset nominal4MHz and CCS fallback are equivalent
        to/12.
      fault_flag_difference: Own RM printed76/PDF77 says clearing HSEFAIL/HSEFAULT does not clear HSERDY.
        The initializer does not clear any of these flags; do not import the L011 side effect.
      registers: 'Own RM section4.7.6: HSE+0x1c reset0x0027ff22 has DRIVER[3:0], WAITCYCLE[5:4], MODE6, HEXENPOL7,
        DETCNT[18:8], STABLE19 RO, PDRIVER[23:20] and DIGFLT24. No FREQRANGE or PFREQRANGE selector exists;
        frequency_ranges_hz is omitted to encode None. Both four-bit drive fields document only codes0..7,
        despite wider SDK macros/comments. Configure both phases before enable; board selects the drive. Preserve
        HEXENPOL and reserved bits; initial DIGFLT=false.'
      selectors: 'Own RM section4.7.1: SYSCLK codes HSI0/HSE1/LSI3/LSE4; codes2/5/6/7 reserved. Complete own
        clock tree/register map has no documented PLL or AUTOTRIM. HSI.TRIM[10:0], DIV[14:11], STABLE15 has
        no WAITCYCLE. Live divider-only changes are permitted by section4.5.2 while TRIM is unchanged. Factory
        trim halfword at0x001007c0; erased0xffff is not admitted.'
      security: Preserve CLKCCS/HSECCS/LSECCS/LSELOCK independently. CLKCCS forces nominal4MHz HSI regardless
        of the requested divider; retained factory-HSI fallback bounds are3.92..4.08MHz. The effective fallback
        frequency is documented, but the exact internal DIV/enable mutation mechanism is not. Check requested-HSI
        and forced-fallback actual envelopes through final HCLK/PCLK/Flash settings. HSECCS/LSECCS automatically
        request LSI without setting softwareLSIEN; preserve unchanged legal LSI, its trim/wait and software-request
        state.
      detector: DETCNT is1..2047. HSE detection counts131072 cycles during DETCNT/LSI. Use ceil(8000000000/actual_minimum_hz),
        and prove actual_minimum_hz*DETCNT > 131072*ccs_lsi_maximum_hz. At4MHz the count2000 fits11 bits;
        the chosen full4..32MHz range preserves positive margin. WAITCYCLE3 means262144 cycles, not a wall-clock
        timeout.
      retained_consumers: 'RTC.CR1.SOURCE1 owns HSE even if calendarSTART=0, because AWT can useRTCCLKD. Reuse
        only exact enabled/stable HSE parameters and pads; do not stop/rewrite a retained HSE. SOURCE3 owns
        raw HSIOSC and requires enabled/stable factory-correct trim; divider-only changes preserve raw HSIOSC.
        RTC sources0/2 and all RTC/AWT state are preserved;4..7 are reserved. ADC is PCLK-derived: require
        ADC.CR.EN=0 before bus changes, preserving BGREN/TSEN and shared analog owners. Reject enabled LVD
        with FLTTIME!=0 and FLTCLK=SYSCLK; preserve legal LSI-filtered or unfiltered LVD. Other bus-dependent
        consumers, including a PCLK-filtered VC, must be quiescent. Independently reject an enabled VC with
        any VCx_CR1.BLANKCH1..6 selected: its BLANKTIME window counts PCLK cycles even with LSI filtering
        or the output filter disabled (own RM section21.7.3 printed537/PDF538).'
      gpio: Own GPIO map has DIR, PUR, AFRH/L, ANALOG, RISEIE/FALLIE, OPENDRAIN and FILTER, with no PDR, input-enable
        or lock register. Configure owned pads input first, disable pad-local pull-up/open-drain/edge interrupts/filter,
        AF0, then analog for crystal or digital for bypass. Preserve unrelated pins and shared filter-clock
        fields. Crystal reserves both pads; bypass onlyOSC_IN. Preserve the whole-boot union of incoming enabled
        and requested HSE pad ownership.
      transition: Entry must already have legal actual source/bus/Flash state. Raise Flash WAIT to the own
        documented maximum, then guard AHB/APB at least/8 without weakening larger inherited divisors. Prefer
        unchanged factory-correct HSI. Retrim only without a raw-HSI owner, via unchanged legal LSI bridge
        and temporarily suppressed CLKCCS; restore original policy. Never retune/reset LSI. Configure/read
        HSE while stopped and STABLE clear; switch/read selector before installing final divisors and lowering
        Flash WAIT. Preserve all key-protected unrelated bits and CR2 controls.
      fault_contract: STABLE is a startup latch and does not clear after later failure; HSERDY is a separate
        edge flag. Reject relevant HSE/LSE FAIL/FAULT without clearing ready/fault flags. Recheck effective
        source, enable/STABLE, trim/divider, HSE parameters, mux/prescalers, preserved policy and faults before
        freezing. Finite polls count CPU iterations while execution continues; no elapsed-time or source-loss
        recovery guarantee. Failure publishes no frozen clocks and may leave the guarded/bridge state reached;
        reset before retry. No PLL, sleep/resume, runtime retuning or recovery is qualified.
      retained_analog_pad: Own DS Table 5-2 printed 23/PDF 24 identifies PA00 as both OSC_IN and VC1_CH1.
        Own RM section 21.7.2 printed 536/PDF 537 identifies VC1_CR0.INP=01 and INN=01 as CH1. An enabled
        VC1 selecting either input owns PA0 independently of the comparator filter clock or blanking state.
        Before any HSE stop, restart, parameter change or pad write, reject this retained owner. Exact reuse
        of an already enabled, stable, matching HSE and matching pads is permitted only with no oscillator
        or pad writes; preserve the comparator and its inputs.

