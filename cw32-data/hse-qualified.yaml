      security: 'Own RM section4.7.2 PDF71: preserve configurable CLKCCS/HSECCS/LSECCS. CLKCCS forces
        HSI 8 MHz (/6), independent of requested HSI divider; qualify both requested HSI and fixed-/6
        fallback. No PLL exists.'
      pins: 'Own DS Table5-2 PDF26: PF00 OSC_IN physical5 and PF01 OSC_OUT physical6 on LQFP48 and both
        LQFP64 body variants; whole-boot union of incoming enabled and requested HSE pad ownership.'
      contract: One-time direct source initialization only. STABLE is a startup latch; finite polls while
        CPU executes are not elapsed-time or source-loss recovery guarantees. Reset after failure. No
        sleep/resume, runtime frequency switching, calibration or PLL API.
