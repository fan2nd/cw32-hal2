    qualification:
      conditions: 'Own DS Table7-4 PDF47: VDD 1.7..5.5 V, VDDA=VDD, ambient -40..85 C with retained factory HSI.
        Actual HCLK/PCLK <=24 MHz below 1.8 V and <=96 MHz otherwise.'
      bypass_conflict: Own RM PDF55 qualifies 4..32 MHz; DS PDF54 gives 1..32 MHz. Admit only the actual 4..32
        MHz intersection for both crystal and bypass.
      parameters: Own HSE register PDF76 has no range selector. DRIVER and PDRIVER are four bits, but only 0..7
        documented; use the same board-selected drive for both. WAITCYCLE=3, DIGFLT=false; no parameter changes
        after enable. Preserve HEXENPOL and RFU. DIGFLT=true and automatic HEXEN control are deferred.
      security: Own RM PDF62/PDF71 forces nominal HSI4 MHz after CLKCCS fallback, independent of requested HSI
        DIV. This is /24 of factory 96 MHz, not the HAL default /12=8 MHz. Preserve CLKCCS/HSECCS/LSECCS/LSELOCK
        and unchanged legal LSI, including automatic requests. Relevant sticky HSE/LSE FAIL/FAULT are rejected
        without clearing.
      pins: Own DS PDF35 establishes PF0 OSC_IN physical5 and PF1 OSC_OUT physical6 for both LQFP48 and QFN48;
        wrong RM PDF67 example PB7/PC13 is not used. No ADC/VC/OPA overlap on these pads. GPIO lacks LOCK/SPEED/HIGHIE/LOWIE;
        only PF3 has PDR, so never write PF0/PF1 PDR. Preserve ODR/shared filter/interrupt flags.
      entry: Undeclared enabled HSE is refused before MMIO writes. Any declared enabled HSE requires exact mode/drive/wait/filter/detector/pad
        reuse and is never stopped or rewritten, including RTC/AWT owners. Fresh HSE requires HSEEN=0 and STABLE=0.
        RTC source3 requires enabled stable factory HSI and blocks retrim; PSC1-derived RTCCLKD also feeds AWT
        and must stay <=1 MHz even with calendar START=0.
      analog: 'Inspect both ADC1/ADC2 EN; all VC1..4 PCLK filtering and all32 CR2 blanking enables; OPA1/2 CALEN/AZRUN/START;
        both DAC channels trigger/DMA/wave state. Reject timing-dependent retained activity before clock mutation.
        Inspect LVD directly: no own RCC gate. Preserve static analog owners, BGR/TS/references and configuration
        gates without resets.'
      ownership: Capture common inherited LSE reservation before backend writes. HSE reservations union inherited
        and requested mode for the boot; exact reuse cannot release any pad. Source loss never releases GPIO
        ownership.
      transition: Raise and acknowledge Flash WAIT3 first; enable and poll unchanged HSI; write guarded
        prescalers plus explicit HSI selector together in keyed CR0, then verify selector/dividers/HSIEN/STABLE
        and faults. Incoming HSI TRIM must already yield legal90..100MHz whenever enabled, including
        when initially disabled. This avoids stale external-selector replay; it is not source-loss recovery.
      contract: One-time direct HSI/HSE initialization; no PLL, LSE setup, runtime retune, sleep/resume or recovery.
        Actual incoming source/buses/Flash and unchanged LSI must already be legal. Finite polls require CPU
        progress; STABLE is startup-only. Frozen external timings cease to apply after source loss/fallback;
        failed init requires reset.

qualification:
  actual_frequency: All declared actual source endpoints must lie in 4..32 MHz. Family-specific bypass
    source agreement, unresolved RM/DS discrepancies and deliberate software coverage narrowing are
    recorded above; L010 sources both support 1..32 MHz, but its initial implementation starts at 4 MHz.
  conditions: F020/F030/A030 own DS general conditions support 1.65..5.5 V and -40..105 C; their conditional
    lower-power 125 C extension is excluded. L031/R031/W031/L083/L052/L010/L011 use the own-family supply and -40..85 C
    retained-HSI intersections recorded above. External waveform, supply, load, tolerance and aging remain
    board obligations.
  frequency_ranges: RM bins are stated for crystal nominal frequency; endpoints are shared between adjacent
    documented bins. The accepted upper-bin choice at shared nominal endpoints does not relax the separate
    4..32 MHz actual endpoint requirement. L010/L011 have no frequency-range selector; their
    omitted frequency_ranges_hz explicitly encodes None, not four synthetic bins.
  detector: F020/x030 retain their own mandatory-one CCS handling. L031/R031/W031/L083 CR1.CLKCCS/HSECCS/LSECCS
    are genuine configurable controls and must be preserved; enabled HSE/LSE failure detectors require
    LSIEN=1. CLKCCS alone does not enable a detector. HSE.DETCNT is nonzero 11-bit, counts 131072 HSE
    cycles, and each own RM recommends 8000/fHSE_MHz. ceil(8000000000
    / actual_minimum_hz) leaves positive margin above 131072 * 36080 / actual_minimum_hz. Retained unchanged
    LSI must already be legal inside own RM 32.8 kHz +/-10%; this is not a measurement or proof for arbitrary
    trim. L031/R031/W031/L083 own DS factory LSI accuracy of +/-3% is not assigned to inherited arbitrary trim;
    36080 Hz is the upper endpoint of the own-RM safe 32.8 kHz +/-10% range. Detector qualification is
    limited to the admitted HSE/retained-HSI condition intersection, including W031 minimum 2.0 V.
    L010/L011 preserve their independently documented automatic LSI request behavior without requiring
    software LSIEN=1; their own bounds and L011's conservative 41000 Hz discrepancy are recorded above.
  pins: F020/F030/A030/L031/R031/W031/L052/L083 use OSC_IN=PF0 and OSC_OUT=PF1 in independently
    rendered own DS tables. L010 uses PA0/PA1 and L011 uses PC13/PB7, as independently qualified above. Exact parts derive
    physical package availability from pinouts YAML; family aliases use the applicable-package intersection.
    PC15 digital HSE_OUT is a separate output function.
  registers: F020 authored PAC retains vendor FREQ spelling for bits 3:2; its manual names these FREQRANGE.
    Families with frequency selectors use their own typed HseRange; L010/L011 have no such selector
    and instead use own four-bit HseDrive with only codes0..7 named. HSE.STABLE is RO. AWT SRC=2 means HSE; RTC CR1
    SOURCE=0,2,4,5,6,7 means LSE,LSI,HSE/128,/256,/512,/1024. L031/R031/W031 have no PLL; SYSCLK=2
    remains reserved. Their SYSCLK selectors are HSI=0, HSE=1, LSI=3, LSE=4. L010/L011 independently use those same SYSCLK
    codes, with RTC SOURCE0=LSE,1=HSE,2=LSI,3=raw HSIOSC;4..7 reserved. Their AWT SRC values are
    HSIOSC=0, LSI=1, HSE=2, LSE=3, ETR=4; all other encodings remain unnamed. L083 has its own
    SYSCLK enum including PLL=2 and uses AUTOTRIM MD=3 for the standalone timer, not AWT.
  bypass_waveform: All waveform limits apply simultaneously, including duty 40..60%, high and low at
    least 15 ns each, rise and fall at most 20 ns each, high 0.7*VDDIOx..VDDIOx and low VSS..0.3*VDDIOx,
    together with the own pad I/O ratings. The 32 MHz/40% duty combination fails the minimum pulse width.
    Own DS external-clock values are design-guaranteed, not production-tested.
  startup: Select drive using the actual board and resonator. WAITCYCLE=3 is 262144 HSE cycles; the
    own DS typical 2 ms startup at 8 MHz is not a universal maximum or software timeout guarantee.
    STABLE is a startup latch and does not prove source continuity after startup.
