    qualification:
      conditions: Own DS VDD 1.65..5.5 V and VDDA=VDD; ambient -40..85 C is the retained factory-HSI accuracy
        intersection. Actual HCLK/PCLK maxima are 24 MHz below 1.8 V and 64 MHz otherwise. The complete
        declared actual HSE envelope stays within 4..32 MHz.
      pins: 'Own DS Table5-2 PDF27 bonds PF0/PF1 on every modeled package: LQFP100 pins12/13, LQFP80 pins7/8,
        both LQFP64 body sizes pins5/6. GPIO uses keyed LCKR at offset0x3c, not LOCK.'
      registers: Own RM PDF75 has SYSCLK HSI=0/HSE=1/PLL=2/LSI=3/LSE=4, with 5..7 reserved. HSE PDF80 DRIVER[1:0],
        FREQRANGE[3:2], WAITCYCLE[5:4], MODE6, FLT7, DETCNT[18:8], STABLE19 RO; preserve reserved bits31:20.
      retained_consumers: 'RTC SOURCE4..7 reserves HSE regardless of START or wake-timer state. Inspect
        AUTOTRIM through its own gate: enabled TIMER mode (MD=3), AUTO=0 may retain HSE or raw HSIOSC; reject
        other active modes, reserved SRC and active ETR with an HSE request. LVD EN && FLTEN && FLTCLK blocks
        required raw-HSI retrim. Exact ready HSE/pad reuse is required for a retained owner.'
      transition: Preserve configurable CCS and retain unchanged legal LSI for enabled HSE/LSE detectors.
        Preserve the own PLL-entry escape through unchanged HSI before LSI; stop and observe PLL !STABLE
        before source oscillator/divider changes. No PLL output configuration is admitted.
