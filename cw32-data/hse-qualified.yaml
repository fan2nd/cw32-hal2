        1.8 V and <=48 MHz otherwise. Retained factory HSIOSC keeps ambient -40..85 C (Table7-17 PDF51).'
      bypass_conflict: Own RM section4.3.3 PDF53 says 4..32 MHz while own DS Table7-13 PDF48 says 1..32
        MHz; only their 4..32 MHz intersection is admitted. All actual endpoints must fit.
      prestart: 'Own RM section4.7.6 PDF75-76: PFREQRANGE/PDRIVER before STABLE and FREQRANGE/DRIVER after
        STABLE; configure every parameter before HSEEN. Both phases use the declared nominal range and
