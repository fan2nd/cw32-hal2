        electrical limits. Nine F020 HSI pairs and twelve F030/A030/L083 HSI pairs remain admitted; other documented
        hardware settings are not asserted absent or invalid. F020 raw output is capped at48MHz, the
        other three at64MHz. L052 has no system PLL.
      - PllSource::HSE uses the undivided Config.hse source in crystal or bypass mode, with actual input
        4..24MHz and literal multiplier 2..12. Crystal follows the vendor-documented internal composition;
        no hidden reference-duty certificate or runtime measurement is claimed. Bypass requires the
        OSC_IN waveform contract, including 40..60 percent duty. Existing board, pad and owner limits apply.
      - Default is disabled. No independent output, runtime retuning, sleep/resume or reference-loss recovery
        guarantee. Stable legal entry, quiescent clock consumers and reset-before-retry apply.
      - Typed configuration preserves reserved-debug default0x5 and uses real PLL.STABLE startup/stop acknowledgment.
        HSE must be ready before PLL enable; its mode, pads and source selector are checked through finalization.
        Retained RTC/AUTOTRIM/LVD/CCS owners, guarded Flash/buses and final readback remain mandatory.
      - ClockBounds preserves a rate-only qualification through multiplication and division. Strict duration
        getters require has_cycle_timing_bounds; ADC constructors reject this PLL source before ADC/RCC writes.
        F030/A030 complementary PWM rejects before synthesis or ATIM/RCC enable even with zero dead time;
        its pin wrappers retain their prior GPIO initialization and drop contract.
