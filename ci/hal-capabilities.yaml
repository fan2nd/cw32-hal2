        - Stage94 SPI1/SPI2/SPI3 RX/TX use 6/7, 8/9 and 10/11 with native CR2 gates, fixed typed DR and byte SRAM staging. SPI requires two exclusive static stages and atomic one-time pair admission; rejection of either channel leaves both admission states unchanged. Inputs remain consumed, and later SPI configuration failure does not roll back successful admission.
