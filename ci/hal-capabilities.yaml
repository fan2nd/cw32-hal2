    - id: external_low_speed
      status: partial
      scope: Init-only nominal 32768 Hz crystal/bypass LSE and held RTC source on twenty-two exact source-qualified packages; eighteen retained prior packages plus two native L011 and two native L012 packages with own monitoring and handover contracts.
      implemented_families: [CW32F030, CW32A030, CW32F020, CW32L031, CW32R031, CW32L052, CW32L083, CW32L010, CW32L011, CW32L012]
      limitations:
      - Other packages retain inherited-pad protection only. Every-cycle board bounds, waveform, drive and load qualification are required.
      - None preserves LSE parameters and pads. The fifteen retained prior packages retain their existing CCS/monitor policies.
        Exact enabled reuse never restarts or changes the selected monitoring policy.
      - L031/R031/L052/L083 preserve calibrated LSI; only a repeatedly verified stopped unused source can load factory trim for a requested monitored LSE start. No live trim, source reset or IRQ acknowledgement.
      - L052 independently configures pre-start and run analog banks while disabled, rejects active/automatic AUTOTRIM calibration, preserves off LPTIM/LCD work gates, and checks its own RTC reset roster.
      - L083 has one analog bank, six native UART consumers, GPIO LCKR and exact-package LSI routes. It preserves off LPTIM/LCD work gates and rejects active/automatic AUTOTRIM calibration.
      - L083 requires 256 * LSE_min_hz > 129 * 33784 before peripheral acquisition or RCC writes. Its own 1.65..5.5 V and -40..85 C envelope, nominal 32768 Hz, per-cycle bounds and full board electrical qualification all apply. The previous sixteen qualifications and HSI/HSE/PLL successful paths are unchanged.
      - Native L010 has independent four-bit running/startup drive and no amplitude. StartupOnly requires inherited
        LSECCS clear and supplies no running-loss guarantee; MonitoredExistingRoutes requires legally stable unchanged
        LSI at most 36080Hz and 256 * LSE_min_hz > 129 * 36080. Native CCS may request LSI with LSIEN clear.
        Existing protection/IRQ/timer routes remain deliberately active; no cold LSI startup or calibration.
      - Native L010 source-zero startup requires the public RTC_OUT/RTC_1Hz observer handover and whole-GPIOB
        operational-window contract. Configuration gates attempt bounded restoration and report failed restoration; dormant timer work gates are
        not probed. The shared inspection helper also attempts restoration after initial enable-readback failure.
      - Native L011/L012 share four-bit drive and StartupOnly semantics through direct typed PAC branches.
        MonitoredExistingRoutes additionally requires stable unchanged factory-matching native LSI at own halfword 0x001007C2,
        with source-qualified maxima 41000Hz and 36080Hz respectively and 256*LSE_min >129*LSI_max.
        No source frequency or per-window jitter is measured; L011 factory versus RM legal range remains distinct.
      - New L011/L012 starts inspect configuration-only domains and whole GPIOC under its explicit event-progress handover.
        Closed output banks, retained timer roots and inaccessible L012 UART3 remain unverified functional ownership conditions;
        L012 UART3 gate and BTIM/ATIM mapping conflicts are not resolved by a quiet-looking state or a closed gate.
        No raw PINLOCK reuse is admitted for these two families. Native RTC LSE uses SOURCE0,PSC1=0,PSC2=0x3fff,
        and bounded source transitions stage division before switching; attach never repairs or retunes inherited state.
      - Failure retains source enables, pad reservations and diagnostics. Ordinary reset may not clear retained LSE controls; POR may be required.
      - LSE system clock is separately qualified for twenty-two exact packages; classic3, exact4 L031/R031,
        exact3 L052, exact5 L083, exact3 L010, exact2 L011 and exact2 L012 above. The twenty-three auxiliary source qualifications remain unchanged.
        No runtime switching, automatic RTC fallback, clock-loss recovery, low-power or silicon qualification.
