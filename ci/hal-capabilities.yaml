    - id: external_low_speed_sysclk
      status: partial
      scope: Init-only nominal 32768 Hz LSE SYSCLK on twenty-two exact packages; classic3, exact4 L031/R031, exact3 L052, exact5 L083, exact3 L010, exact2 L011 and exact2 L012.
      implemented_families: [CW32F020, CW32F030, CW32A030, CW32L031, CW32R031, CW32L052, CW32L083, CW32L010, CW32L011, CW32L012]
      limitations:
      - Family aliases and every other exact package are excluded. Config.lse is the single source declaration;
        the same board every-cycle tuple supplies SYSCLK, buses and RTC.
      - Classic3 retains mandatory CCS and its own stopped-source proof. Exact4 L031/R031 preserves
