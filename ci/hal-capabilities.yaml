        - Independent Stage92 runtime and metadata/source reviews accepted the bounded main result. Main ran no canonical data generation and all 910 generated files stayed unchanged; UART/DMA runtime algorithms remain unchanged.
        - At Stage92 main acceptance final capability reports and the separate final-source 2-library/3-ELF clean replay had not run. No hardware result is claimed.
      - families: [CW32L031, CW32L052, CW32R031]
        scope: Safe staged byte UART TX, finite RX and combined/split DMA on ten exact native four-channel selections; separate Stage93 SPI1 and L052 SPI2 paired byte DMA has main software acceptance, with final-source clean replay unrun at that point.
