        - Only recorded TC without TE plus STATUS5 and SOFTSRC0 returns the same capability and exclusive static u8/u16/u32 buffers.
        - Errors or inconsistent completion permanently retain owners; forget leaks and Drop may block forever. No early abort, timeout recovery or new borrowed hardware API.
