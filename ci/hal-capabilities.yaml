# Authored capability scope. Review this with HAL changes; never generate it from build counts.
schema_version: 1
scope: Maintained source-level HAL capability declarations. Hardware YAML is canonical; this file declares
  implementation policy, not new hardware facts or build/runtime evidence.
families:
- CW32A030
- CW32F002
- CW32F003
- CW32F020
- CW32F030
- CW32L010
- CW32L011
- CW32L012
- CW32L031
- CW32L052
- CW32L083
- CW32R031

functions:
  gpio:
    register_kinds:
    - gpio
    - gpiob
    - gpioc
    - gpiof
    evidence:
    - path: embassy-cw32/src/gpio.rs
      anchor: pub struct Flex
    - path: embassy-cw32/src/exti/mod.rs
      anchor: pub struct ExtiInput
    modes:
    - id: digital_io
      status: partial
      scope: Owned digital input/output with selected-pad electrical restrictions.
      limitations:
      - Package, oscillator, debug, reset and RF pad exclusions apply; output-only and pull capabilities are
        per pad.
    - id: run_mode_interrupt_wait
      status: partial
      scope: Typed run-mode GPIO interrupt waits.
      limitations:
      - Events coalesce; no deep-sleep wake or lossless edge history guarantee.
  uart:
    register_kinds:
    - uart
    evidence:
    - path: embassy-cw32/src/usart/mod.rs
      anchor: pub struct Uart
    modes:
    - id: blocking
      status: partial
      scope: Eight-bit blocking serial, parity/stop configuration and owned pins.
      limitations:
      - Serial clock and package route limits apply.
    - id: async
      status: partial
      scope: IRQ-driven async TX/RX, including shared L083 vectors.
      limitations:
      - Ordinary Uart/UartRx IRQ-only constructors wake per byte without a receive buffer and require prompt executor
        service; non-L010/L011/L012 UARTs can overwrite without an overrun flag.
    - id: nine_bit_pio
      status: partial
      scope: L012 ordinary UART1/2/3 blocking and IRQ PIO nine-data-bit payloads without parity, through u16-container methods.
      implemented_families:
      - CW32L012
      limitations:
      - Existing package pins, clock and IRQ qualification only. Other families reject nine-bit configuration; byte methods on nine-bit owners reject before activity even for empty transfers.
      - Buffered and staged DMA constructors remain byte-only; u16 transfers on a DMA owner reject without implicit PIO fallback. No nine-bit idle API, address filtering, LIN or half-duplex expansion.
      - Current software acceptance is recorded in docs/l012-extensions-validation.md; publication is established separately by its containing commit; no hardware validation or new L012 RX DMA handshake claim.
      evidence:
      - path: docs/uart-l012-nine-bit.md
      - path: embassy-cw32/src/usart/nine_bit.rs
        anchor: pub async fn write_u16
    - id: single_wire_half_duplex
      status: partial
      scope: L012 ordinary HalfDuplexUart blocking and IRQ PIO over one owned TXD pin, open-drain AF with required external pull-up.
      implemented_families:
      - CW32L012
      limitations:
      - Only existing UART, package, baud, frame and IRQ qualification. No RXD pin, split, DMA, ring, flow-control, mode conversion or embedded-io wrapper API.
      - Reads first flush output; valid empty reads also flush and may wait indefinitely. Nine-bit byte-read mismatch rejects before flushing. Hardware performs direction return; no software direction toggle.
      - Peer turn-taking is the application responsibility; no arbitration, collision detection, response-time, electrical or lossless guarantee. Drop may truncate transmission.
      - Current software acceptance is recorded in docs/uart-dac-extensions-validation.md; publication requires the containing commit; existing DMA, other-family and low-power limitations are unchanged.
      evidence:
      - path: docs/uart-l012-half-duplex.md
      - path: embassy-cw32/src/usart/half_duplex.rs
        anchor: pub struct HalfDuplexUart
    - id: rts_cts
      status: partial
      scope: Full owned RTS+CTS flow control.
      limitations:
      - Only package selections with the required qualified signals can construct this mode; throughput is
        not validated.
      pins_all:
      - TX
      - RX
      - RTS
      - CTS
      evidence:
      - path: embassy-cw32/src/usart/uart.rs
        anchor: pub fn new_with_rtscts
    - id: tx_cts
      status: partial
      scope: Owned TX+CTS flow control.
      limitations:
      - Only package selections with the required qualified signals can construct this mode; throughput is
        not validated.
      pins_all:
      - TX
      - CTS
      evidence:
      - path: embassy-cw32/src/usart/tx.rs
        anchor: pub fn new_with_cts
    - id: rx_rts
      status: partial
      scope: Owned RX+RTS flow control.
      limitations:
      - Only package selections with the required qualified signals can construct this mode; throughput is
        not validated.
      pins_all:
      - RX
      - RTS
      evidence:
      - path: embassy-cw32/src/usart/rx.rs
        anchor: pub fn new_with_rts
    - id: finite_idle_receive
      status: partial
      scope: Native finite async ordinary Uart/UartRx caller-buffer reception to full capacity or observed RXIDLE.
      implemented_families:
      - CW32L010
      - CW32L011
      - CW32L012
      pins_all:
      - RX
      limitations:
      - First nonempty poll clears stale idle only; unread RC/data and errors remain available.
      - Co-latched RC is consumed before idle with best-effort boundary attribution; errors retain existing priority.
      - Per-byte task service remains necessary; no software FIFO, numeric timeout, lossless framing or bounded completion.
      - Main verification passed six actual ARM libraries, five ELF links and four finite source/data gates.
      - Three existing RCC LSE-constant warnings remain in applicable L010/L011 main rows; no hardware validation is claimed.
      - At main acceptance clean had not run; completion requires a separate final-source two-library/two-ELF clean receipt.
      evidence:
      - path: embassy-cw32/src/usart/rx.rs
        anchor: pub async fn read_until_idle
      - path: docs/uart-idle.md
    - id: buffered_ring_receive
      status: partial
      scope: Direct BufferedUartRx/BufferedUart owners provide continuous IRQ receive collection into bounded RX rings; safe constructors consume static storage, while unsafe new_borrowed variants tie ordinary buffer borrows to owner Drop (combined split halves share a lifetime).
      implemented_families:
      - CW32A030
      - CW32F002
      - CW32F003
      - CW32F020
      - CW32F030
      - CW32L010
      - CW32L011
      - CW32L012
      - CW32L031
      - CW32L052
      - CW32L083
      - CW32R031

      pins_all:
      - RX
      limitations:
      - Existing 54 selections retain their package routes and exclusions; source/API scope is not a build-total claim.
      - Inherent and async trait reads return an available clean prefix; read_exact fills the slice. Nonwaiting blocking_read and read_ready are available. Empty reads preserve queued bytes and pending errors.
      - Async BufRead fill_buf lends a contiguous occupied prefix without copying; consume releases only exposed bytes. IRQ writes remain disjoint from the held prefix, but prolonged borrowing can cause overflow.
      - Safe constructors consume the nonempty static ring even on constructor error and do not return it; unsafe borrowed constructors release the borrow after normal RX Drop and the shared TX/RX lifetime ends, and require storage to remain valid and exclusive if the owner is leaked.
      - Retained clean prefix precedes the first pending error; software BufferOverflow and line errors discard later
        ISR observations until the error is consumed.
      - Ten non-L010/L011/L012 families permit silent pre-ISR RDR overwrite even with ring space; native ORE does not
        count lost frames, and NE requires 16x/8x sampling.
      - Collection depends on IRQ progress; finite capacity does not guarantee lossless reception, bounded waits or throughput.
      - Hardware RTS reflects RC rather than software queue occupancy; no ring-watermark backpressure is provided.
      - No buffered idle markers, DMA ring, numeric timeout or storage-reclamation API.
      - Stage83 main verification passed 13 actual ARM libraries, 11 ELF links and five focused source/data gates;
        independent main runtime and metadata/source reviews accepted the frozen implementation.
      - Three existing native L010/L011 RCC LSE-constant warnings remain in each applicable main row.
        Main ran no hardware generation, and all 905 generated hardware files stayed unchanged.
      - At main acceptance clean had not run; final-package completion requires a separate final-source
        three-library/three-ELF clean receipt and five focused gates. No hardware timing qualification is claimed.
      evidence:
      - path: embassy-cw32/src/usart/mod.rs
        anchor: pub struct BufferedUartRx
      - path: docs/uart-buffered-rx.md
    - id: advanced_serial
      status: unimplemented
      scope: No maintained HAL API declaration for this mode.
      limitations:
      - Nine-bit beyond the separately declared L012 ordinary PIO subset, half-duplex beyond the separately declared L012 single-wire subset, LIN, auto-baud, RS485 direction, synchronous and low-power modes require separate
        qualification; per-instance hardware presence is not universally asserted.
    - id: safe_peripheral_dma
      status: experimental_partial
      scope: Safe staged TX, finite RX and combined/split UART DMA on F030/A030/L083 and thirteen exact F020/L031/L052/R031 parts; exact L012 C8T6/C8U6 remain UART TX-only.
      limitations:
      - Every admitted profile requires qualified SRAM and normal reset/clean-runtime startup; static UART/channel/staging owners are consumed. Generic classic aliases retain MissingMemoryMetadata rejection.
      - CPU copy per byte and possible chunk gaps; write completes memory-to-TDR transfer and flush separately waits for the wire.
      - Cancellation retains each direction's current chunk; clean RX tails remain available, and TE or ambiguous completion permanently quarantines resources.
      - RX gaps may lose frames with no overrun indication; FE/PE reports promptly but recovery waits for the old DMA count.
      - TX requires TX, RX requires RX, combined construction requires both signals and independent static staging/channels.
      - No DMA RTS/CTS, continuous RX, borrowed zero-copy, early abort, throughput or finite-liveness guarantee.
      implemented_families:
      - CW32A030
      - CW32F020
      - CW32F030
      - CW32L083
      - CW32L031
      - CW32L052
      - CW32R031

      - CW32L012
      overrides:
      - families: [CW32L012]
        scope: Safe staged byte UART TX only on exact L012 C8T6/C8U6.
        limitations:
        - Only CW32L012C8T6/C8U6 have qualified 64 KiB Flash and 8 KiB SRAM; generic cw32l012 rejects safe copy/staging without memory metadata.
        - Native CH1/2 share DMACH12 IRQ9 and CH3/4 share DMACH34 IRQ10; IRQ11 remains CORDIC. No channel five or sibling flag clearing.
        - Startup observes all eight channel registers; RESTART/SRCLOAD/DSTLOAD remain zero and remaining count reads CCNT.
        - Normal clean-runtime admission, permanent raw revocation, error quarantine, forget leaks and potentially unbounded Drop remain.
        - Native PAC typed enums, five read-only CCNT handles and ten removed TC/TE setters change source compatibility; STATUS remains RW.
        - Stage86 main passed 4 standalone ARM libraries and 11 ELF links, all 15 exiting zero without warnings; 1413 source files and 910 generated files stayed unchanged.
        - Generation and five finite gates plus one renderer passed in segments; two source-record/checker preparation failures remain preserved. No hardware result is claimed.
        - At main acceptance clean had not run; final-package completion requires its separate final-source 2-library/4-ELF clean receipt.
        - UART1/2/3 TX use PA9/PA7/PA8 AF1 and request selectors 1/3/5; private staging isolates caller slices. Flush separately waits for TXBUSY0.
        - No L012 DMA RX/combined UART; its separate RC/ORE proof remains blocked. SPI has its separately declared native scope; no other requests, borrowed hardware constructor, buffered-plus-DMA owner, early abort or finite-liveness guarantee.
      - families: [CW32F020]
        scope: Safe staged byte UART TX, finite RX and combined/split DMA on exactly CW32F020C6U7/K6U7/F6U7, through native CH1/CH2.
        limitations:
        - Exact 8 KiB SRAM at 0x20000000..0x20002000 and normal reset/clean-runtime admission are required; generic cw32f020 rejects safe DMA/staging with MissingMemoryMetadata.
        - Native CH1/CH2 use independent DMACH1/DMACH2 IRQs. UART1/2/3 RX selectors 0/2/4 and TX selectors 1/3/5 may use either channel, subject to safe package pins.
        - F6 UART1 has no safe RX or TX; PA13/PA14/PF3 remain excluded. Combined UART requires distinct safe TX/RX pins, distinct admitted channels and independent exclusive static stages.
        - Own CN1.4 p288 qualifies byte RDR-to-SRAM DMA; own SDK requires software RC clear. FE/PE/RC have no ORE/NE indication; typed ICR no-op preserves unrelated fields.
        - Static UART/channel/staging owners survive cancellation and forget. Clean retirement requires recorded TC without TE plus STATUS5, request closure and fencing before staged-byte access; DMA faults permanently quarantine affected resources.
        - FE/PE returns promptly while an invalid pending chunk remains running; later inherent recovery awaits its old count. Clean RX tails remain available. CPU copies and chunk/rearm gaps can lose frames without a loss count.
        - TX completion retires memory-to-TDR work; flush separately waits for the wire. SPI DMA has its separate declared scope; no other peripheral DMA consumers, new raw hardware requests, buffered-plus-DMA owner, RTS/CTS or idle/circular DMA, early abort, zero-copy or finite-liveness guarantee.
        - Historical Stage84 copy/TX main passed 15 ARM libraries and 16 ELF links, all 31 exiting zero; generation and five finite source gates passed in documented segments. These results do not verify Stage92 RX.
        - Independent Stage84 runtime and metadata/source reviews accepted that copy/TX main. Only L010F8P6/L011K8T6 library rows emitted three existing RCC warnings each; all F020 rows and ELF links were warning-free.
        - At Stage84 main acceptance its separate final-source 2-library/4-ELF clean receipt had not run. No hardware result is claimed.
        - Stage92 main passed eight standalone ARM libraries and 21 ELF links, all 29 exiting zero without warnings. Both finite source checks passed after the preserved initial D01 PIN/AFR comparison failure and checker-only correction.
        - Independent Stage92 runtime and metadata/source reviews accepted the bounded main result. Main ran no canonical data generation and all 910 generated files stayed unchanged; UART/DMA runtime algorithms remain unchanged.
        - At Stage92 main acceptance final capability reports and the separate final-source 2-library/3-ELF clean replay had not run. No hardware result is claimed.
      - families: [CW32L031, CW32L052, CW32R031]
        scope: Safe staged byte UART TX, finite RX and combined/split DMA on ten exact native four-channel selections.
        limitations:
        - Exactly CW32L031C8T6/C8U6/F8P6/F8U6/K8U6/K8V6, CW32L052C8T6/R8S6/R8T6, CW32R031C8U6; each has 64 KiB Flash and 8 KiB SRAM at 0x20000000..0x20002000.
        - Generic cw32l031/cw32l052/cw32r031 compile the controller/UART DMA surface but reject safe admission and staging with MissingMemoryMetadata; no memory fallback.
        - CH1 uses DMACH1 IRQ9, CH2/3 share DMACH23 IRQ10 and CH4 uses DMACH4 IRQ11; no CH5. Both shared handlers service only their own channel; typed native R1W0 commands preserve siblings and reserved bits.
        - Normal reset/clean-runtime entry and conservative one-time admission apply. Dirty state is rejected without reset/recovery; raw acquisition permanently revokes safe admission.
        - UART1/2/3 RX selectors 0/2/4 and TX selectors 1/3/5 may use any CH1..4, subject to safe package pins. Combined UART requires distinct TX/RX pins, distinct channels and independent exclusive static stages.
        - L031F8P6 UART1 has no safe RX/TX; L031F8U6 UART1 permits RX-only on PA9/AF2 or PC15/AF6 with no safe TX. PA13/PA14/PF3 remain excluded.
        - Each own manual supplies byte RDR-to-SRAM DMA and FE/PE/RC without ORE/NE; each own SDK requires software RC clear. The current classic RX contract binds the complete package routes and typed ICR no-op seeds.
        - Static UART/channel/staging owners survive cancellation and forget; clean RX tails remain available. Clean retirement requires recorded TC without TE plus STATUS5, request closure and fencing before staging reuse; DMA faults permanently quarantine resources.
        - FE/PE returns promptly but recovery may wait indefinitely for the old DMA count. CPU copies and chunk/rearm gaps can lose frames without a loss count; TX flush separately waits for the wire.
        - SPI DMA has its separate declared scope; no other peripheral DMA consumers, new raw hardware requests, buffered-plus-DMA owner, RTS/CTS or idle/circular DMA, early abort, zero-copy or finite-liveness guarantee.
        - R031 whole-GPIOA effects preserve existing functional handover obligations; no RF-safe handover/coexistence claim.
        - Historical Stage85 copy/TX main passed six ARM libraries and 21 ELF links, all 27 exiting zero without warnings; generation, five finite source gates and the renderer passed in documented segments. These results do not verify Stage92 RX.
        - Three Stage85 source-checker preparation failures remain recorded; corrections changed no HAL/example bytes. At that main acceptance its separate final-source 2-library/4-ELF clean receipt had not run. No hardware result is claimed.
        - Stage92 main passed eight standalone ARM libraries and 21 ELF links, all 29 exiting zero without warnings. Both finite source checks passed after the preserved initial D01 PIN/AFR comparison failure and checker-only correction.
        - Independent Stage92 runtime and metadata/source reviews accepted the bounded main result. Main ran no canonical data generation and all 910 generated files stayed unchanged; UART/DMA runtime algorithms remain unchanged.
        - At Stage92 main acceptance final capability reports and the separate final-source 2-library/3-ELF clean replay had not run. No hardware result is claimed.
      pins_any:
      - TX
      - RX
      evidence:
      - path: embassy-cw32/src/usart/dma_tx.rs
        anchor: pub fn new_with_dma
      - path: docs/uart-dma-tx.md
      - path: docs/uart-dma-rx.md
      - path: docs/classic-uart-dma-rx.md
      - path: docs/classic-uart-dma-rx-evidence.json
      - path: docs/f020-dma-owned.md
      - path: docs/four-channel-dma-owned.md
      - path: docs/l012-dma-owned.md
      facts:
      - dma_channels
  spi:
    register_kinds:
    - spi
    evidence:
    - path: embassy-cw32/src/spi/mod.rs
      anchor: pub struct Spi
    modes:
    - id: bounded_api
      status: partial
      scope: Blocking master with owned, package-qualified routes; async master supports qualified 4-16-bit IRQ PIO or byte-only staged DMA.
      limitations:
      - Clock/electrical bounds apply; slave and advanced protocol modes are absent.
      - The ten IRQ PIO families share a constructor/Drop lifecycle fence with blocking owners; ordinary blocking data/error/divider behavior remains separate.
    - id: slave_async
      status: unimplemented
      scope: No slave API; master async buses are declared separately under async_pio and byte-only safe_peripheral_dma.
      limitations:
      - Exact slave/advanced hardware mode audit remains per instance; neither master backend admits slave operation.
    - id: async_pio
      status: partial
      scope: Ordinary-borrowed IRQ PIO full-duplex 4-16-bit word master on thirteen SPI instances across F020/F002/F003/L010/L011/L012/L031/R031/L052.
      limitations:
      - Explicit spi_async_pio and spi_dma qualifications coexist on F020/L031/L052/R031 and L012; neither implies the other. Existing package routes, clock bounds and blocking word widths remain authoritative.
      - All five word-generic async SpiBus methods keep at most one frame outstanding and at most one DR read and one DR write per poll; the ISR has no driver/future/caller-buffer pointers and never accesses DR.
      - Final error-free TXE=1/BUSY=0 is required; the BUSY tail self-wakes and consumes CPU with no built-in deadline, finite-liveness or low-power guarantee.
      - Cancelled/forgotten operations retain pending frame settlement; keep the original CS selected and successfully flush before deselecting or changing devices/configuration.
      - Errors use disabled destructive PIO recovery; driver Drop and forgotten-owner reconstruction can truncate work and are never successful wire completion.
      - Synchronous calls first attempt bounded settlement and may report PioBusy; set_config reports Busy without consuming a pending hardware error.
      - Blocking and async constructors/Drop on these nine families fence stale static interest before pin/reset/gate changes. An inactive instance is skipped before ISR MMIO.
      - L012 SPI2/SPI3 require the complete SPI23 shared handler for PIO and DMA, dispatching PIO2/DMA2/PIO3/DMA3 with each active guard before MMIO; isolated banks and no shared NVIC disable/unpend remain. An unowned peer must already be quiescent or externally handled.
      - PIO owners require no DMA or staging; widths use the existing sealed Word set. No automatic CS, generic cancellation-safe SpiDevice, early-abort acknowledgment, throughput or hardware-validation guarantee.
      - Wider PIO word support is a current software delta, not covered by historical byte-only receipts. DMA owners reject non-u8 words before MMIO, even for empty slices; no implicit backend fallback. Software acceptance is recorded in docs/unblocked-hal-extensions-validation.md; it does not itself establish publication.
      - Historical Stage89 main validation passed 14 standalone ARM libraries and 19 linked ELFs, all 33 exits zero, plus seven finite source/data commands. Main ran no canonical generation and all 910 generated files stayed unchanged.
      - L010F8P6 library/async/blocking rows and L011K8T6 library/async rows each retain three existing unused RCC LSE-constant warnings; the other 12 libraries and 16 ELFs were warning-free.
      - Independent Stage89 runtime and source/metadata reviews accepted that frozen implementation. At its main acceptance clean had not run; final-package completion requires a separate final-source 2-library/5-ELF replay and seven commands including one generation bootstrap. No hardware behavior is established.
      - Stage93 coexistence has separate main software acceptance and independent runtime and metadata/source reviews; its final-source 2-library/6-ELF clean replay had not run at main acceptance. Historical Stage89 receipts do not accept this change. Borrowed PIO constructors and destructive PIO recovery/Drop remain separate from static DMA ownership and permanent quarantine.
      - The constructor fixes the backend behind one lifetime-generic async method/trait surface. The five dual-capable families, including L012, gain DMA-gated variants in the already non_exhaustive ConfigError and Error enums; preserved PIO signatures do not mean an unchanged variant set.
      - Stage94 adds native DMA on exactly L012 C8T6/C8U6 SPI1/SPI2/SPI3 while retaining borrowed PIO. Main 6-library/15-ELF verification and five finite main commands passed, with independent runtime/source acceptance. At main acceptance final-source clean had not run; completion requires its separate 2-library/6-ELF receipt. No hardware result is claimed.
      - DMA now uses the associated InterruptHandler bound; a generic wrapper constrained only to InterruptHandler<T> may require the associated-handler bound or a type equality even though concrete dedicated handlers retain their types.
      implemented_families:
      - CW32F020
      - CW32F002
      - CW32F003
      - CW32L010
      - CW32L011
      - CW32L012
      - CW32L031
      - CW32R031

      - CW32L052
      pins_all:
      - SCK
      - MOSI
      - MISO
      evidence:
      - path: embassy-cw32/src/spi/pio.rs
        anchor: pub fn new_async
      - path: docs/spi-async-pio.md
      - path: docs/spi-async-word-widths.md
      - path: examples/spi-async/src/bin/async_master.rs
    - id: safe_peripheral_dma
      status: experimental_partial
      scope: Safe paired full-duplex master byte DMA and async SpiBus with private static TX/RX SRAM staging on F030/A030/L083, thirteen exact F020/L031/L052/R031 parts and native SPI1/SPI2/SPI3 on exactly CW32L012C8T6/C8U6; Stage94 native main has separate software acceptance; at main acceptance final-source clean had not run and requires its own receipt, separate from historical Stage93 acceptance.
      limitations:
      - Eight families and fifteen family/controller pairs are declared. Historical Stage93 added five families, seven pairs and twenty selected exact-part/controller routes, bringing its scope to eight families/thirteen pairs. Its main passed 13 standalone ARM libraries and 24 linked ELFs in 37 actual Cargo invocations, all exiting zero; 24 dependent HAL archives are not additional standalone commands. Five finite source/data gates and the separate source-navigation refresh passed.
      - Independent Stage93 runtime and metadata/source reviews accepted the bounded main result. Original M16 Cargo linking succeeded but retention failed with ENOSPC; reviewed recovery preserved that failed attempt, reused M01-M15 and retained original M16 outputs without another Cargo invocation, then built only M17-M37.
      - Stage93 L010F8P6/L011K8T6 library and async-PIO ELF rows each retained three existing unused RCC LSE-constant warnings; the other 11 libraries and 22 ELFs were warning-free. All 1478 frozen source files, 910 generated files and the recorded Rust/Cargo 1.99.0 toolchain remained unchanged; main ran no canonical generation.
      - At Stage93 main acceptance final capability reports and the separate final-source 2-library/6-ELF clean replay had not run. Final-package completion requires their separate receipts; main receipts remain bound to their frozen main inputs. No hardware result is claimed.
      - F020 SPI1/SPI2, L031/R031 SPI1 and L052 SPI1/SPI2 use own-qualified byte DR endpoints and RX/TX selectors 6/7 or 8/9. No alternative-AF or raw-request expansion follows.
      - Exactly F020C6U7/K6U7/F6U7, L031C8T6/C8U6/F8P6/F8U6/K8U6/K8V6, L052C8T6/R8S6/R8T6, R031C8U6 have the new exact SRAM admission; generic aliases retain MissingMemoryMetadata rejection.
      - Clean startup admission consumes whole static SPI/pins, two channels and two exclusive staging slices; caller memory never becomes a DMA endpoint. Sequential admission can consume the first channel when the second fails.
      - F020 has only CH1/DMACH1 and CH2/DMACH2; one permanently admitted pair serves one controller. SPI1/SPI2 DMA examples are separate deployments and clean Drop does not restore admission.
      - L031/L052/R031 use native CH1/DMACH1, CH2+CH3/DMACH23 and CH4/DMACH4. Shared handlers preserve sibling ownership/flags; there is no CH5.
      - Borrowed new_async PIO remains available on the five Stage93 DMA families and L012. The constructor fixes the backend; common lifetime-generic methods do not relax static DMA resources or provide switching.
      - Already non_exhaustive ConfigError and Error gain existing DMA-gated variants on the five dual-capable families. Dedicated interrupt dispatch checks each separate backend active guard before MMIO.
      - The DMA constructor requires Binding<T::Interrupt, T::InterruptHandler>. A generic wrapper constrained only to Binding<T::Interrupt, InterruptHandler<T>> may need the associated bound or an appropriate type equality; preserved concrete classic bindings do not prove universal generic source compatibility.
      - Existing 12 MHz maximum SCK and minimum divisor 2 on F020 or 4 on L031/L052/R031 remain; safe package pins and exact memory bounds govern construction.
      - R031 whole-GPIOA handover restrictions remain. No RF arbitration, coexistence or continuity is claimed.
      - Stage94 adds only CW32L012C8T6/C8U6 SPI1/SPI2/SPI3, one family/three controller pairs/two parts/six selected routes. RX/TX selectors are 6/7, 8/9 and 10/11, with fixed native DR addresses and CR2 request RMW preserving sampled EN/unrelated bits; classic CR1 gates remain unchanged.
      - Native TYPE1/BLOCK/SIZE0/REPEAT1 descriptors reload REPEAT each chunk; SIZE0 selects SRAM bytes, not CPU byte MMIO or a peripheral-access width. Typed DR read clears RXNE. No native SDK SPI DMA cookbook is identified; RX-first arm/request order is a conservative engineering choice.
      - Native CH1/2 use DMACH12 IRQ9 and CH3/4 use DMACH34 IRQ10; IRQ11 remains CORDIC. Four physical channels permit at most two reserved full-duplex DMA pairs; clean Drop does not restore admission. Generic cw32l012 compiles the surface but retains MissingMemoryMetadata safe staging/admission rejection.
      - L012 SPI1 keeps its dedicated IRQ25 handler; SPI2/SPI3 require the complete SPI23 IRQ26 associated handler for PIO and DMA. PIO2/DMA2/PIO3/DMA3 each guard activity before MMIO; inactive or gated peers are skipped and no teardown disables/unpends shared vectors or changes sibling banks.
      - L012 retains its 24 MHz maximum, even dividers 2..256, MISO pull-down rejection and whole-bank GPIO handover. Its UART remains TX-only; the separate UART RX RC/ORE proof remains blocked.
      - Stage94 main passed 6 standalone ARM libraries and 15 ELF links in 21 accepted Cargo rows, all exiting zero, plus five finite source/declaration commands, with independent runtime/source acceptance. Main ran zero canonical generation. At main acceptance final-source clean had not run; completion requires its separate 2-library/6-ELF receipt after one existing generation bootstrap with all 910 generated files matching main; no hardware result is claimed.
