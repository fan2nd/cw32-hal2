    - id: encoder
      status: partial
      scope: Owned polling quadrature encoder.
      limitations:
      - Each capture is one latch; no lossless history, async or DMA. Classic encoder reload is fixed at 65535;
        count/direction/wrap samples are non-atomic.
      evidence:
      - path: embassy-cw32/src/timer/qei.rs
      - path: cw32-data/classic-timer-input.yaml
      implemented_families: *id001
      pin_signal_sets:
      - - CAP1
        - CAP2
      - - CH1
        - CH2
    - id: classic_complementary_dead_time_global_enable
      status: partial
      scope: Optional complete classic A+B pairs, interior comparison duty, fixed symmetric dead time and explicit global MOE.
      limitations:
      - F030/A030 only. No endpoints, per-pair gating, brake/rearm, inversion, runtime timing changes or pad-level/shutdown guarantee.
      implemented_families:
      - CW32F030
      - CW32A030
      pin_signal_sets:
