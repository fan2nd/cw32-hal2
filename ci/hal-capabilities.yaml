# Authored capability scope. Review this with HAL changes; never generate it from build counts.
schema_version: 1
scope: Maintained source-level HAL capability declarations. Hardware YAML is canonical; this file declares
  implementation policy, not new hardware facts or build/runtime evidence.
families:
- CW32A030
- CW32F002
- CW32F003
- CW32F020
- CW32F030
- CW32L010
- CW32L011
- CW32L012
- CW32L031
- CW32L052
- CW32L083
- CW32R031
- CW32W031
functions:
  gpio:
    register_kinds:
    - gpio
    - gpiob
    - gpioc
    - gpiof
    evidence:
    - path: embassy-cw32/src/gpio.rs
      anchor: pub struct Flex
    - path: embassy-cw32/src/exti/mod.rs
      anchor: pub struct ExtiInput
    modes:
    - id: digital_io
      status: partial
      scope: Owned digital input/output with selected-pad electrical restrictions.
      limitations:
      - Package, oscillator, debug, reset and RF pad exclusions apply; output-only and pull capabilities are
        per pad.
    - id: run_mode_interrupt_wait
      status: partial
      scope: Typed run-mode GPIO interrupt waits.
      limitations:
      - Events coalesce; no deep-sleep wake or lossless edge history guarantee.
  uart:
    register_kinds:
    - uart
    evidence:
    - path: embassy-cw32/src/usart.rs
      anchor: pub struct Uart
    modes:
    - id: blocking
      status: partial
      scope: Eight-bit blocking serial, parity/stop configuration and owned pins.
      limitations:
      - Serial clock and package route limits apply.
    - id: async
      status: partial
      scope: IRQ-driven async TX/RX, including shared L083 vectors.
      limitations:
      - The IRQ-only path wakes per byte; no receive buffer; prompt executor service required; non-L010/L011/L012 UARTs
        can overwrite without an overrun flag.
    - id: rts_cts
      status: partial
      scope: Full owned RTS+CTS flow control.
      limitations:
      - Only package selections with the required qualified signals can construct this mode; throughput is
        not validated.
      pins_all:
      - TX
      - RX
      - RTS
      - CTS
      evidence:
      - path: embassy-cw32/src/usart.rs
        anchor: pub fn new_with_rtscts
    - id: tx_cts
      status: partial
      scope: Owned TX+CTS flow control.
      limitations:
      - Only package selections with the required qualified signals can construct this mode; throughput is
        not validated.
      pins_all:
      - TX
      - CTS
      evidence:
      - path: embassy-cw32/src/usart.rs
        anchor: pub fn new_with_cts
    - id: rx_rts
      status: partial
      scope: Owned RX+RTS flow control.
      limitations:
      - Only package selections with the required qualified signals can construct this mode; throughput is
        not validated.
      pins_all:
      - RX
      - RTS
      evidence:
      - path: embassy-cw32/src/usart.rs
        anchor: pub fn new_with_rts
    - id: buffered_ring_idle
      status: unimplemented
      scope: No maintained HAL API declaration for this mode.
      limitations:
      - Software ring buffering and idle-line receive are absent.
    - id: advanced_serial
      status: unimplemented
      scope: No maintained HAL API declaration for this mode.
      limitations:
      - Nine-bit, half-duplex, LIN, auto-baud, RS485 direction, synchronous and low-power modes require separate
        qualification; per-instance hardware presence is not universally asserted.
    - id: safe_peripheral_dma
      status: experimental_partial
      scope: Safe F030/A030/L083 staged TX, finite-chunk RX and combined split TX/RX DMA with ordinary caller slices.
      limitations:
      - F030/A030/L083 with qualified SRAM metadata and clean startup admission; static UART/channel/staging owners are consumed.
      - CPU copy per byte and possible chunk gaps; write completes memory-to-TDR transfer and flush separately waits for the wire.
      - Cancellation retains each direction's current chunk; clean RX tails remain available, and TE or ambiguous completion permanently quarantines resources.
      - RX gaps may lose frames with no overrun indication; FE/PE reports promptly but recovery waits for the old DMA count.
      - TX requires TX, RX requires RX, combined construction requires both signals and independent static staging/channels.
      - No DMA RTS/CTS, continuous RX, borrowed zero-copy, early abort, throughput or finite-liveness guarantee.
      implemented_families:
      - CW32A030
      - CW32F030
      - CW32L083
      pins_any:
      - TX
      - RX
      evidence:
      - path: embassy-cw32/src/usart.rs
        anchor: pub fn new_with_dma
      - path: docs/uart-dma-tx.md
      - path: docs/uart-dma-rx.md
      facts:
      - dma_channels
  spi:
    register_kinds:
    - spi
    evidence:
    - path: embassy-cw32/src/spi.rs
      anchor: pub struct Spi
    modes:
    - id: bounded_api
      status: partial
      scope: Blocking master with owned, package-qualified routes; F030/A030/L083 additionally support staged byte async DMA.
      limitations:
      - Clock/electrical bounds apply; slave and advanced protocol modes are absent.
    - id: slave_async
      status: unimplemented
      scope: No slave API; F030/A030/L083 master async byte bus is declared separately under safe_peripheral_dma.
      limitations:
      - Exact slave/advanced hardware mode audit remains per instance; async master is limited to F030/A030/L083 staged DMA.
    - id: safe_peripheral_dma
      status: experimental_partial
      scope: Safe F030/A030/L083 paired full-duplex master byte DMA and async SpiBus with private static TX/RX SRAM staging.
      limitations:
      - F030/A030/L083 with clean startup admission; whole static SPI/pins, two channels and two staging slices are consumed.
      - Both clean DMA terminals and wire idle precede success; DMA/SPI errors permanently quarantine the whole pair.
      - Cancellation retains the current chunk; preserve the original CS selection and successfully flush before changing devices.
      - No generic cancellation-safe SpiDevice, zero-copy, safe early abort, uninterrupted clocks, throughput or hardware-validation guarantee.
      implemented_families:
      - CW32A030
      - CW32F030
      - CW32L083
      pins_all:
      - SCK
      - MOSI
      - MISO
      evidence:
      - path: embassy-cw32/src/spi.rs
        anchor: pub fn new_with_dma
      - path: docs/spi-dma.md
      - path: examples/spi-dma/src/main.rs
      facts:
      - dma_channels
  i2c:
    register_kinds:
    - i2c
    evidence:
    - path: embassy-cw32/src/i2c/mod.rs
      anchor: mod classic;
    modes:
    - id: bounded_api
      status: partial
      scope: Blocking seven-bit master with owned pins.
      limitations:
      - Bounded timing/electrical contracts; ten-bit, slave and async APIs absent.
    - id: ten_bit_slave_async
      status: unimplemented
      scope: No maintained HAL API declaration for this mode.
      limitations:
      - No ten-bit, slave or async API; advanced mode hardware must be checked per IP.
    - id: safe_peripheral_dma
      status: unimplemented
      scope: No maintained HAL API declaration for this mode.
      limitations:
      - No safe peripheral DMA integration; presence of dma_channels metadata is a routing fact, not a driver.
      facts:
      - dma_channels
  adc:
    register_kinds:
    - adc
    evidence:
    - path: embassy-cw32/src/adc/classic.rs
      anchor: pub fn blocking_read_sequence
    - path: embassy-cw32/src/adc/sequence/mod.rs
      anchor: pub fn blocking_read_sequence
    - path: embassy-cw32/src/adc/l012.rs
      anchor: pub fn blocking_read_sequence
    - path: cw32-data/classic-adc-scans.yaml
    - path: cw32-data/adc-sequences.yaml
    modes:
    - id: single_conversion
      status: partial
      scope: Owned blocking software-triggered single conversion.
      limitations:
      - Family electrical/reference/startup constraints apply; raw internal channels are not calibrated engineering
        units.
    - id: ordered_scan
      status: partial
      scope: Ordered blocking software-triggered scan using the family sequence facts.
      limitations:
      - Classic multi-slot scans exclude buffered/internal inputs and share one sample time; L010/L011/L012
        permit per-slot sample times. This blocking mode excludes continuous, IRQ and externally triggered scans.
      facts:
      - adc_limits.sequence
      - adc_limits.classic_scan
    - id: async_single_conversion
      status: partial
      scope: Owned finite software single conversion with typed dedicated ADC IRQ binding; classic EOC/OVW or sequence EOS wake.
      facts:
      - adc_limits.sequence
      limitations:
      - Running clocks, enabled interrupts and eventual executor service are required. Config.timeout bounds
        synchronous polls only; caller timeout/select provides a deadline with a working wake source.
      - Successful logical stop permits fresh initialization. L010/L011/L012 explicitly document sequence-cursor
        reset; classic reuse follows fresh MODE0/MODE4 configuration and is an inference, not an analog drain guarantee.
      - Required cleanup readback failure is terminal per instance across replacement owners and blocking/async
        modes until chip reset. Inherited external triggers, watchdog/request state and unsupported coupling are rejected.
      - Shared analog resources and unowned flags are preserved within each backend's ownership contract;
        raw interference, continuous, periodic, DMA, trigger-route, deep-sleep and silicon validation are excluded.
      overrides:
      - families: [CW32L012]
        peripherals: [ADC1]
        scope: Independent L012 ADC1 software single conversion with EOS completion and a borrowed Common owner.
      - families: [CW32L012]
        peripherals: [ADC2]
        status: unimplemented
        scope: L012 ADC2 retains its blocking API; shared ADC2_DAC IRQ ownership is not implemented.
        limitations:
        - Finite conversion evidence is qualified, but DAC quiet-peer/shared-handler lifetime and terminal-fault
          containment need a separate owner. ADC1's dedicated-vector policy cannot be applied to IRQ30.
      evidence:
      - path: embassy-cw32/src/adc/sequence/mod.rs
        anchor: pub fn try_new_async
      - path: embassy-cw32/src/adc/classic.rs
        anchor: pub fn try_new_async
      - path: embassy-cw32/src/adc/l012.rs
        anchor: pub fn try_new_async
      - path: docs/adc-low-async.md
      - path: docs/adc-remaining-async.md
      - path: docs/adc-remaining-async-evidence.json
    - id: async_ordered_scan
      status: partial
      scope: Finite software ordered scan with typed IRQ completion, repeated channel handles and full-output commit.
      facts:
      - adc_limits.sequence
      - adc_limits.classic_scan
      limitations:
      - Classic has four/eight slots, one common acquisition time, unbuffered external multi-slot inputs and EOS/OVW
        wake. L010/L011/L012 ADC1 have eight per-slot sample times, qualified mixed sources and EOS-only wake.
      - The future requires terminal completion and stopped START, stages results, verifies owned masking/acknowledgment,
        then commits the entire slice without an await. Cancellation or error leaves all output unchanged.
      - The same source-qualified electrical, deadline and terminal-fault contract as async_single_conversion applies.
        No continuous, periodic, hardware-triggered, DMA, RF, deep-sleep, lossless streaming or silicon timing claim.
      overrides:
      - families: [CW32L012]
        peripherals: [ADC1]
        scope: Independent L012 ADC1 software one-shot 1–8-slot ordered scan, retaining shared BGR/TS and blocking ADC2.
      - families: [CW32L012]
        peripherals: [ADC2]
        status: unimplemented
        scope: L012 ADC2 retains blocking ordered scans; shared ADC2_DAC async lifetime is not implemented.
        limitations:
        - ADC2 async requires a checked DAC quiet-peer lease or shared IRQ owner with terminal-fault containment.
          This is an ownership boundary, not missing finite ADC conversion evidence.
      evidence:
      - path: embassy-cw32/src/adc/sequence/mod.rs
        anchor: pub async fn read_sequence
      - path: embassy-cw32/src/adc/classic.rs
        anchor: pub async fn read_sequence
      - path: embassy-cw32/src/adc/l012.rs
        anchor: pub async fn read_sequence
      - path: docs/adc-low-async.md
      - path: docs/adc-remaining-async.md
      - path: docs/adc-remaining-async-evidence.json
    - id: continuous_irq_triggered_scan
      status: unimplemented
      scope: No maintained HAL API declaration for this mode.
      limitations:
      - No continuous or hardware-triggered scan API. Software one-shot async single/scans are declared separately
        for all classic lines, L010/L011 and L012 ADC1; the L010/L011 BTIM1-triggered single owner remains separate.
    - id: external_reference
      status: unimplemented
      scope: No maintained HAL API declaration for this mode.
      limitations:
      - No complete owned external-reference API. VDDA/internal references differ by family; L012 exposes VDDA
        only, F002 VDD only.
    - id: coupled_dual_adc
      status: unimplemented
      scope: No maintained HAL API declaration for this mode.
      limitations:
      - L012 converters are independently owned through Common; synchronized/slave/coupled modes are not exposed.
      families:
      - CW32L012
      evidence:
      - path: embassy-cw32/src/adc/l012.rs
        anchor: pub struct Common
    - id: safe_peripheral_dma
      status: unimplemented
      scope: No maintained HAL API declaration for this mode.
      limitations:
      - No safe peripheral DMA integration; presence of dma_channels metadata is a routing fact, not a driver.
      facts:
      - dma_channels
    - id: other_trigger_interconnect
      status: unimplemented
      scope: No maintained HAL API declaration for this mode.
      limitations:
      - Other destination-local internal/external triggers, cascading, fanout and TRGO consumer routes are
        not qualified. See separately enumerated routes; this is not a claim that all modes exist on every
        instance.
  btim:
    register_kinds:
    - btim
    evidence:
    - path: embassy-cw32/src/timer/low_level.rs
