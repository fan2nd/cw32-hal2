    - id: external_low_speed_sysclk
      status: partial
      scope: Init-only nominal 32768 Hz LSE SYSCLK on twenty-three exact packages; classic3, exact5 L031/R031/W031, exact3 L052, exact5 L083, exact3 L010, exact2 L011 and exact2 L012.
      implemented_families: [CW32F020, CW32F030, CW32A030, CW32L031, CW32R031, CW32W031, CW32L052, CW32L083, CW32L010, CW32L011, CW32L012]
      limitations:
      - Family aliases and every other exact package are excluded. Config.lse is the single source declaration;
        the same board every-cycle tuple supplies SYSCLK, buses and RTC.
      - Classic3 retains mandatory CCS and its own stopped-source proof. Exact5 L031/R031/W031 preserves
        CLKCCS/HSECCS, classifies dual-status factory LSI, and enables only fresh LSECCS. Matching cold LSI
        keeps TRIM/WAIT unchanged but can resume parked consumers; mismatched trim retains its own two-pass proof.
      - On the previous sixteen packages, factory detector LSI stays requested. The target-only 129/256 software margin uses own rate maxima;
        it proves no absolute jitter/window deadline and grants no new LSI SYSCLK capability to L031/R031/W031/L052/L083.
      - Exact3 L052 means CW32L052C8T6, CW32L052R8S6 and CW32L052R8T6 only. Independent startup/run analog
        banks, unconditional native AUTOTRIM admission and preserved CLKCCS/HSECCS/LSELOCK apply.
      - L052 checks configured HSI at final dividers even without HSE or enabled CLKCCS, and separately covers
        fixed fallback with undivided 8.16 MHz without assuming divider retention. WAIT2 remains through LSE
        acknowledgment before final Flash reduction. Matching stopped LSI can resume parked consumers;
        whole GPIOA/B/C/D/F banks can advance events. Newly resumed RTC SOURCE2 is outside accepted combinations.
      - Exact5 L083 means CW32L083RBT6, CW32L083RCT6, CW32L083RCS6, CW32L083MCT6 and CW32L083VCT6 only.
        Its single analog bank has no startup-drive/amplitude fields. Declared minimum VDD must be at least
        1.8 V; conservative raw factory-HSI fallback is 48.96 MHz with no HSI/AHB/APB divider credit,
        independent of CLKCCS. Configured HSI at final bus dividers is checked separately; final WAIT2 remains.
      - L083 inherited enabled PLL escapes through independently legal unchanged ready HSI, then both
        PLLEN=0 and PLL.STABLE=0 must be observed before reference changes. PLL configuration is preserved;
        disabling it intentionally stops its outputs, which must be quiescent along with other changing consumers.
        Inherited HSE parameters/pads and CLKCCS/HSECCS/LSELOCK are preserved. No independent PLL-output lifecycle.
      - HSI and any inherited classic PLL/reference remain enabled. Final buses are installed on HSI before
        one LSE selection; no later divider RMW. L083 performs no CR0 write after the final LSE selection,
        including on failure. Own Flash order/budgets and whole-bank handover limits apply.
      - Fixed 1 MHz time driver rejects before ownership. Old source targets and all 23 auxiliary-LSE paths
        retain admission/order. Loss or HSI fallback invalidates frozen LSE timing; no runtime or silicon guarantee.
      - Exact3 L010 means CW32L010F8P6, CW32L010F8U6 and CW32L010Y8M6 only. Generic L010
        aliases remain excluded. Native Config.lse and independent four-bit drive fields remain the source declaration.
      - L010 StartupOnly keeps inherited LSECCS clear; later loss may leave STABLE set and stop the CPU
        without an error return. MonitoredExistingRoutes requires already stable, unchanged, inherited-legal
        LSI at most 36080 Hz and 256 * LSE_min_hz > 129 * 36080; no factory-monitor preparation or LSI retuning.
      - L010 factory-HSI establishment may temporarily request unchanged LSI. Entry-nonstable first requests
        reject retained RTC2, UART1/2 SOURCE3, enabled LPTIM ICLKSRC3, MCO4, LSIRDY IRQ and enabled LSI-filtered
        VC/LVD owners. Residual timer/GPIO/IWDT and external progress remain an explicit functional handover.
      - L010 preserves CLKCCS and fault/brake/IRQ routes, retains factory HSI on success and validates requested
        HSI at final divisors. Fixed fallback coverage uses full 4.08 MHz without divider credit regardless of
        CLKCCS; electrical headroom does not promise detection or continuity. Owned Flash WAIT changes alone
        can refresh native admission after original non-WAIT routes are reverified. No CR0 write follows final LSE selection.
      - Exact2 L011 means CW32L011K8T6 and CW32L011K8U6 only, with PC14/PC15 on pins 2/3.
        Generic aliases remain excluded. The historical L011 addition preserved the prior nineteen system and all auxiliary projections.
        Native examples keep StartupOnly, Level2/Level10 drives and 16384 cycles; their example declarations require board qualification.
      - L011 StartupOnly has no factory-LSI prerequisite; the guarded HSI-calibration bridge may request
        unchanged electrically legal LSI. MonitoredExistingRoutes instead requires stable non-erased own
        factory-halfword matching at first native preflight, with 10-bit TRIM at 0x001007C2, unchanged WAIT,
        maximum 41000 Hz and 256 * LSE_min_hz > 129 * 41000. No auto-preparation, LSI TRIM/WAIT write or rate measurement.
        The RM legal-adjustment range and DS factory accuracy/trim-step conflict remain separate contracts.
      - L011 entry-nonstable first-LSI-request checks remain latched through both admissions and include
        RTC SOURCE2/reserved 4..7, UART1/2/3 SOURCE3 regardless of RXEN/TXEN, enabled LPTIM ICLKSRC3,
        MCO4, LSIRDY IRQ and enabled LSI-filtered VC/LVD. Held resets reject; each configuration gate
        restores independently and retains the restoration-failure error. Legal stable automatic LSI with LSIEN=0 is admitted.
      - L011 retained raw-HSI RTC ownership requires enabled stable factory HSI; necessary HSI start/restart
        or waiting on initially unready HSI rejects MCO3/HSIRDY. Residual timer/GPIO/IWDT and cascade observers
        remain a functional handover, including dedicated PB0 AF3 HSIOSC_OUT even with MCO disabled.
        GPIOC whole-bank inspection can advance events; no dormant timer working gate opens for inspection.
      - L011 defaults to HSI/24, retaining factory HSI on success. Configured HSI at final divisors and
        full 4.08 MHz effective fallback are separately qualified with no fallback divider credit. WAIT3 is
        initial only; final WAIT0/1/2/3 follows maximum qualified HCLK, with default HSI/24 yielding WAIT0.
        Final divisors precede the last LSE selection; no later CR0 write. No runtime switching, automatic
        RTC migration, rollback, fault recovery, elapsed-time or continued-execution guarantee is added.
      - Exact2 L012 means CW32L012C8T6 and CW32L012C8U6 only, with PC14/PC15 on pins 3/4.
        Prior twenty-one system and all twenty-three auxiliary projections are unchanged. Native examples use
        StartupOnly, independent Level2/Level10 drives and 16384 cycles with explicit declarations requiring board qualification.
      - L012 defaults to HSI/12, nominal 8 MHz; reset and effective fallback HSI/24 are separate facts.
        Factory HSI remains enabled. StartupOnly has no factory-LSI prerequisite and can halt execution on loss.
        MonitoredExistingRoutes requires stable non-erased factory-matching 9-bit LSI at 0x001007C2, unchanged
        TRIM/WAIT and 256 * LSE_min_hz > 129 * 36080; no monitor preparation or rate/jitter measurement.
      - L012 first-LSI admission stays latched from entry across repeated consumer checks; both I2C1/2
        master/slave raw source1/3 are refused, including before required HSI start/retrim. Own RTC/UART/LPTIM,
        MCO/IRQ, ungated LVD and all four VC controls apply. Closed disputed UART3 work gates are not opened.
        Held resets reject; restoration failures preserve the detailed gate error.
      - L012 ADC1/ADC2 share a configuration-and-work gate. The supported handover permits their inspection
        interval's conversion/trigger/downstream progress before an enabled-ADC refusal. Gate restoration
        cannot undo it. Whole-GPIOC, dedicated HSI/LSI outputs, inaccessible UART3, timer/cascade/IWDT and
        external observers remain explicit functional handover limits; the platform bus-master boundary is unchanged.
      - L012 independently qualifies configured HSI at final divisors and full 4.08 MHz fallback without
        fallback divider credit. Final WAIT is set under verified calibrated HSI/final divisors before LSE
        selection; default HSI/12 yields WAIT0. Both WAIT interfaces must agree, mixed readbacks fail closed,
        and FETCH/CACHE/CACHEINVALID are preserved. No CR0 or FLASH write follows final selection, even on error.
        RTC/AWT is not reset or migrated; no rollback, source-loss recovery or continued-execution guarantee.
