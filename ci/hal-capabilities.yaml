      status: experimental_partial
      scope: Safe init-admitted CopyChannel capability and owned static-SRAM software copy.
      limitations:
      - F030/A030/L083 with qualified SRAM metadata and normal reset/clean-runtime entry. Dirty state is rejected; arbitrary active bootloader handovers are unsupported.
      - TC without TE plus complete STATUS and SOFTSRC readback returns the same owners; errors/forget quarantine them. Drop may block indefinitely; no early abort or borrowed DMA.
      - Raw PAC access remains a technically unsafe ownership escape. Raw channel acquisition/downgrade permanently revokes safe admission.
      implemented_families: *id002
    - id: hardware_request_transfer
      status: unimplemented
      scope: Unsafe hardware-request transfer API; no peripheral lifecycle wrapper.
      limitations:
      - Only x030 exposes unsafe borrowed hardware constructors. L083 exposes UART/SPI RX/TX routes solely for its separately declared safe staged integration.
      overrides:
      - families: [CW32A030, CW32F030]
        status: experimental_partial
        scope: Existing unsafe hardware-request one-shot transfer.
        limitations:
        - Caller owns peripheral lifecycle, outstanding accesses and forgotten borrows; no safe cancellation.
    - id: safe_peripheral_dma
      status: experimental_partial
      scope: Safe admitted F030/A030/L083 UART TX/RX and paired SPI master byte requests with constructor-owned static SRAM staging.
      limitations:
      - Limited to F030/A030/L083 UART TX/RX and SPI master with qualified SRAM and normal reset/clean-runtime entry; L083 ADC/LCD/timer requests remain outside this HAL scope.
      - Ordinary caller slices use private chunks; each split half retains its own lease, and clean completion permits reuse or RX tail delivery.
      - TE or inconsistent completion permanently retains affected resources; RX gaps may lose frames, with no safe early abort, continuous RX, zero-copy or finite-liveness guarantee.
      - SPI additionally requires both channel terminals and wire idle; cancellation requires preserving CS through a successful flush.
      implemented_families:
      - CW32A030
      - CW32F030
      - CW32L083
