  rtc:
    register_kinds:
    - rtc
    evidence:
    - path: embassy-cw32/src/rtc/mod.rs
      anchor: pub struct Rtc
    - path: cw32-data/rtc-calendar.yaml
    - path: cw32-data/rtc-alarms.yaml
    modes:
    - id: calendar
      status: partial
      scope: Blocking calendar with preserved-state attach and explicit cold initialization.
      limitations:
      - Native L010/L011/L012 retain qualified HSIOSC and support held LSE on seven exact packages.
        Classic RTCs use pretrimmed LSI, with held LSE on the previous sixteen exact x030/F020/L031/R031/W031/L052/L083 packages.
        All twenty-three are listed in lse-qualified.yaml. Native StartupOnly can retain STABLE after loss;
        MonitoredExistingRoutes retains configured fault routes and stable unchanged LSI. L010 uses inherited_legal;
        L011/L012 additionally require own factory_trim matching at 0x001007C2 with 41000/36080 Hz bounds.
        Native LSE uses SOURCE0 and PSC1=0/PSC2=0x3fff; later RTC activation retains the explicit downstream handover.
        No UTC precision, compensation, subseconds, continuous progression or retention guarantee.
    - id: alarm_a
      status: partial
      scope: Typed recurring weekly Alarm A configuration and enable.
      limitations:
      - Not an absolute deadline; disabled-owner preconditions and bounded register-access windows apply.
      evidence:
      - path: embassy-cw32/src/rtc/alarm.rs
        anchor: pub fn set_alarm_a(
    - id: alarm_event_status
      status: partial
      scope: A/B sticky event observation and acknowledgment; Alarm A enable control.
      limitations:
      - Repeated matches coalesce; acknowledgment can race a new match; no Alarm B programming/enable API.
      evidence:
      - path: embassy-cw32/src/rtc/alarm.rs
        anchor: pub fn alarm_status
    - id: alarm_b_programming
      status: source_disputed
      scope: Alarm B configuration is deliberately withheld.
      limitations:
      - Own manuals and SDK disagree on mask polarity. A/B event observation does not resolve that conflict.
      evidence:
      - path: embassy-cw32/src/rtc/alarm.rs
        anchor: ALARMB is contradictory
      facts:
