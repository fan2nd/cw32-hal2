  sysctrl:
    register_kinds:
    - sysctrl
    evidence:
    - path: embassy-cw32/src/rcc/mod.rs
    - path: embassy-cw32/src/rcc/peripheral.rs
    - path: cw32-data/electrical.yaml
    modes:
    - id: hsi_system_bus_clocks
      status: partial
      scope: Factory-HSI system/bus clocks, qualified operating envelope and central peripheral gate/reset
        policies.
      limitations:
      - Frozen clocks; legal stable entry conditions, declared supply/ambient and actual bounds required. No
        measurement or complete oscillator calibration.
    - id: factory_lsi_sysclk
      status: partial
      scope: Init-only factory-qualified nominal 32800 Hz LSI SYSCLK on F020/F030/A030, exactly CW32F002F3P7/F3U7, CW32F003F4P7/F4U7/E4P7, CW32L031C8T6/C8U6/F8U6, CW32R031C8U6, CW32W031R8U6, CW32L052C8T6/R8S6/R8T6 and CW32L083RBT6/RCT6/RCS6/MCT6/VCT6.
      implemented_families: [CW32F002, CW32F003, CW32F020, CW32F030, CW32A030, CW32L031, CW32R031, CW32W031, CW32L052, CW32L083]
      limitations:
      - F002 means CW32F002F3P7 and CW32F002F3U7 only; own bounds remain 31160..34440 Hz.
        F003 means CW32F003F4P7, CW32F003F4U7 and CW32F003E4P7 only; own bounds are
        31816..33784 Hz (full-temperature ±3%), with 20 KiB Flash and 3 KiB SRAM.
        Both require 1.65..5.5 V and -40..105 C. Generic F002/F003 aliases and unlisted parts
        gain no capability. Neither family has RTC, dedicated LSI_OUT, system PLL/LSE or classic CCS.
      - L031 means CW32L031C8T6/C8U6/F8U6 only, with own 31816..33784 Hz at 1.65..5.5 V,
        -40..85 C and 64 KiB Flash / 8 KiB SRAM. HSI /6 remains the default. Generic/other L031
        gain no LSI SYSCLK capability. The dedicated contract links the separate
        main runtime/source and metadata reviews; this declaration is not an execution receipt.
      - R031 means CW32R031C8U6 only, QFN48, 64 KiB Flash / 8 KiB SRAM, with own
        31816..33784 Hz at 2.2..3.6 V and -40..85 C. Generic R031 stays
        excluded. The native runtime is unchanged. Main source/metadata acceptance covers six
        actual library builds, seven linked ELFs and six passed source/data checks. Package
        completion requires a separate final-source clean replay of one library and two ELFs;
        its result is tracked separately from the immutable main reviews.
      - R031 RFCLK has a dedicated 16 MHz oscillator; PCLK/GPIOA and PA00..PA03 carry
        an indirect RF-host effect. Existing functional handover permits whole-bank progress
        and keeps inherited RF XTAL_OCLK-fed HSE available. No RF access or hidden safe-Rust
        memory-safety precondition is added; restored gates do not prove RF continuity.
      - W031 means CW32W031R8U6 only, QFN64, 64 KiB Flash / 8 KiB SRAM, with own
        31816..33784 Hz at 2.0..3.6 V and -40..85 C. Generic W031 stays excluded.
        The shared native executable sequence is unchanged. Main verification passed five
        actual library builds, six ELF links, generation and six focused source/data commands.
        Independent runtime/source and metadata/projection reviews accept the frozen main
        implementation. At main acceptance, clean replay had not run; final-package completion
        requires a separate clean one-library/one-ELF receipt. These results do not establish hardware behavior.
      - W031 dedicated 32 MHz RFCLK is separate from its PCLK/SPI1 host path. Whole GPIOB
        inspection can advance internal PB03/04/05/13 host and PB06 IRQ sampling/events,
        including before failure. Functional handover permits this interval without a hidden
        Rust memory-safety precondition or RF-state operation; restored gates cannot undo work.
      - L052 means CW32L052C8T6/R8S6/R8T6 only, with own 31816..33784 Hz at 1.65..5.5 V,
        VDDA=VDD and -40..85 C, 64 KiB Flash / 8 KiB SRAM. Generic L052 stays
        excluded; the independent exact-five L083 capability is declared below. The separate native
        path validates full RTC/AUTOTRIM/UART1/2/3, whole
        GPIOA/B/C/D/F, MCO/PC4 and tagged LCD/LPTIM snapshots. Off work gates stay off
        without local reads. Cold gate-on LCD requires EN=0 and BUMP=0; cold LPTIM EN=0
        and completed reset commands. PC4/AF6 is checked on unbonded C8T6 without a pin token.
      - Exact L052 whole-bank inspection can advance sampling, filters and armed edge/level/event
        paths, including unrelated pins and before failure. Functional handover covers external
        loopbacks and quiescent application clock clients; restoring gates cannot undo activity.
        Live matching LSI is never stopped or retrimmed; cold matching trim skips no admission.
        No timer stop/reset, LCD pump write, IRQ/event clear or RF operation creates admission.
      - Exact L052 retains configured factory HSI and validates it at final bus divisors; fixed
        CCS escape is HSI /6, at most 8.16 MHz before bus-divider credit. No L052 PLL exists.
        Final Flash and HSI bus setup precede the final source-only LSI commit. Failure may
        leave partial state; reset, or power reset for POR-retained LSE controls, before retry.
        Final main verification passed eight actual library builds and eight ELF links with zero
        warnings, plus generation and six finite Python source/data checks. At main acceptance,
        clean replay had not run; final-package completion requires a separate final-source
        two-library/three-ELF clean receipt. These results do not establish hardware behavior.
      - L083 means CW32L083RBT6/RCT6/RCS6/MCT6/VCT6 only; generic L083 and native L010/L011/L012
        stay excluded. Own factory bounds are 31816..33784 Hz at 1.65..5.5 V, VDDA=VDD and -40..85 C.
        RBT6 has 128 KiB Flash, the other four 256 KiB, all with 24 KiB SRAM. Full six-UART,
        six-GPIO-bank, RTC/AUTOTRIM/LVD, tagged LCD/LPTIM and bonded LSI/PLL route snapshots apply.
        Off work gates stay off without local reads; unbonded AF0 guards create no pin tokens.
      - Exact L083 whole-bank windows can advance unrelated pins, filters, armed events and external
        loopbacks before refusal. Functional handover permits these effects and quiesces clock clients.
        Cold matching trim skips no proof; live matching LSI is never stopped or retrimmed.
        No consumer stop/reset, watchdog operation, IRQ/event clear or RF action obtains admission.
      - Exact L083 inherited PLL departs through proven unchanged HSI/HSE and reaches enable0 plus
        coherent dual-ready0 before reference changes. No direct PLL-to-LSI switch or new PLL target.
        Factory HSI at final bus divisors precedes the final LSI commit. WAIT2 remains on success;
        potential external fallback needs 48.96 MHz coverage without HSI/AHB/APB divider credit.
        No L052 fixed-/6 fallback or 48 MHz ceiling is imported. Failure requires reset or power reset
        for POR-retained LSE controls; no rollback or source-loss/sleep recovery is qualified.
      - Exact L083 main ten-library/ten-ELF verification and independent implementation reviews passed.
        At main acceptance clean had not run; final-package completion requires a separate
        two-library/three-ELF clean receipt. Future recipe
        totals are not receipts. The all-54 comparison permits five LSI capability additions and exact
        bonded PLL_OUT projections while preserving old electrical/RTC facts. No hardware result follows.
      - Exact L031/R031/W031 cold admission checks RTC, AWT, UART1/2/3, GPIOA/B/C/F, MCO, PB11 AF and ready/NVIC
        observers even for matching TRIM. PB11 is conservatively inspected on unbonded F8U6;
        FILTER7 means documented AWT overflow and is conservatively rejected. Native configurable
        CCS/LSELOCK and external ownership are retained, with no classic mandatory-CCS rule.
      - Complete stopped-source admission precedes the first source request. Classic mandatory CCS
        checks retain their existing roster. F002/F003 check AWT, UART1/2, GPIOA/B/C, MCO and ready
        observers in two passes plus a post-trim use-edge pass, even if cold TRIM already matches.
        Running factory-matching LSI is reused without retrim or WAIT writes.
      - Whole GPIOA/B/C on F002/F003, or GPIOA/B/C/F on classic and exact L031/R031/W031, inspection windows may advance sampling,
        filters and armed events, even before failure. Software does not clear flags; they may change
        naturally. Restoring gates cannot undo progress; failed restore may leave a gate active.
      - F002/F003 cold preparation uses each family's own 0x001007BA factory halfword and typed ten-bit TRIM-only
        writes with WAIT preserved. An admission/readback failure after trim can leave attempted TRIM.
        No ready event or RCC IRQ4 pending state is cleared to obtain admission or after a new start.
      - F003 ATIM/IR have no independent LSI selector; UART roots and the system-clock handover
        cover their dependencies. No ATIM/IR inspection gate opens, and unrelated gate/reset
        bits including ATIM bit7 are preserved. Existing API qualifications are unchanged.
      - Target LSIEN remains requested after enable attempts. HSI calibration can fail with HSI stopped
        while executing on LSI. No automatic rollback, runtime switching, source-loss or low-power recovery.
      - Selected LSI SYSCLK/bus bounds are rate-only. Classic and exact L031/R031/W031/L052/L083 LsiClock/CalendarClock/RTC
        aliases remain rate-only under every SYSCLK, with nominal 32800/32768 calendar ticks unchanged;
        excluded L031, generic R031/W031/L052/L083 and board LSE retain qualification.
        F002/F003 gain none of those RTC APIs. Strict duration helpers
        and ADC reject this qualification; classic complementary PWM does too. Fixed 1 MHz time-driver
        selection fails before singleton acquisition and RCC MMIO. F002/F003 AWT retains independent HSIOSC timing.
      - Existing optional lsi_output_pin represents independently checked F002/F003 absence; F003
        adds no schema change. Classic retains its
        real output pin, RTC source set and complete consumer checks. No hardware validation is claimed.
