    - id: external_high_speed
      status: partial
      scope: Direct HSE oscillator/crystal or bypass on F020/F030/A030/L010/L011/L012/L031/R031/L052/L083 and digital HEX on F002/F003.
      limitations:
      - Board declares independent minimum/nominal/maximum frequency and electrical conditions. Actual HSE
        interval 4..32 MHz; oscillator pads reserved; no runtime switching or clock-fault recovery guarantee.
      implemented_families:
      - CW32A030
      - CW32F020
      - CW32F030
      - CW32F002
      - CW32F003
      - CW32L010
      - CW32L011
      - CW32L012
      - CW32L031
      - CW32R031

      - CW32L052
      - CW32L083
      pins_any: [HSE_IN, HEX_PB00, HEX_PB01]
      overrides:
      - families: [CW32F002, CW32F003]
        status: partial
        scope: Direct digital HEX input on a qualified PB0 or PB1; one-time initialization only.
        limitations:
        - Board guarantees the complete actual 4..32 MHz interval, supply 1.65..5.5 V and ambient
          -40..105 C; retained HSI and bus limits still apply. No default frequency accuracy.
        - All pad waveform limits apply together, including 40..60 percent duty, at least 15 ns high/low,
          at most 20 ns rise/fall, high 70..100 percent VDDIO and low 0..30 percent VDDIO.
          These board obligations and own I/O ratings are not measured by initialization.
        - Stable electrically legal entry and continuous sources are required; interrupts, DMA and
          clock-dependent users must be quiescent. Failure after acquisition requires reset before retry.
        - Exact-package routes and frozen whole-boot pad reservations apply. Retained AWT reserves
          PB0/PB1 independently of the system mux; active external AWT allows only exact ready reuse,
          and active AWT ETR rejects new HEX requests.
        - Digital input only; no crystal drive, PLL, runtime switching, sleep/resume or clock-loss recovery.
          STABLE is a startup latch; loss can stop the CPU. No automatic fallback or wall-clock timeout guarantee.
      - families: [CW32L031, CW32R031]
        status: partial
        scope: Direct HSE crystal or bypass on exact bonded packages; one-time initialization only.
        limitations:
        - Explicit actual 4..32 MHz endpoints and board waveform/startup qualification. Retained factory HSI
          restricts ambient to -40..85 C. Supply limits are L031 1.65..5.5 V, R031 2.2..3.6 V.
        - L031 QFN20 has no oscillator pads; broad aliases spanning it have no universal HSE route. Crystal
          reserves both pads and bypass only the input; inherited enabled HSE is reserved for the whole boot.
        - Preserve configurable CCS; unchanged legal LSI is retained for enabled HSE/LSE detectors. Frozen
          rates are invalid after source loss or HSI fallback.
        - Retained RTC/AWT HSE requires exact ready parameter/pad reuse. Active AWT ETR rejects HSE;
          raw-HSI AWT/LVD owners reject required retrim. Relevant sticky fault flags are rejected, not cleared.
        - No PLL, RF configuration, runtime switching, sleep/resume, failed-entry recovery or clock-loss service.
      - families: [CW32L010, CW32L011]
        status: partial
        scope: Direct HSE crystal/bypass on all five modeled exact packages; one-time initialization only.
        limitations:
        - Explicit actual 4..32 MHz endpoints. L010 bypass below 4 MHz is deferred software coverage;
          L011 uses the RM/DS intersection. Factory HSI retention limits ambient to -40..85 C.
        - Own VDD floors are 1.62 V and 1.7 V; actual buses are <=24 MHz below 1.8 V,
          otherwise <=48 MHz and <=96 MHz respectively. Waveform, drive and startup are board obligations.
        - Eight documented pre-start/run drive codes, no frequency-range selector and no GPIO PDR.
          Crystal reserves both own pads; bypass reserves the input; inherited pads remain reserved.
        - Preserve configurable CCS and unchanged legal LSI; qualify requested HSI and forced nominal
          4 MHz fallback through final bus and Flash dividers. The L011 LSI source discrepancy remains open.
        - RTC/AWT HSE requires exact ready parameter/pad reuse; raw-HSI ownership blocks retrim.
          ADC EN, SYSCLK-filtered LVD and PCLK-filtered or timer-blanked VC are rejected before clock changes.
          Enabled VC inputs overlapping oscillator pads block HSE restart or pad writes; exact no-write reuse may remain.
          Preserve BGR, TSEN, analog references and flags without group reset.
        - No PLL, runtime switching, sleep/resume or source-loss recovery. Sticky faults are not cleared;
          startup STABLE is not continuous validity. Finite polls need CPU progress; RCC failure needs reset.
      - families: [CW32L012]
        status: partial
        scope: Direct HSE crystal/bypass on both exact packages and their common alias; one-time initialization.
        limitations:
        - Actual 4..32 MHz endpoints, VDD 1.7..5.5 V and ambient -40..85 C. Below 1.8 V actual buses
          are <=24 MHz; otherwise <=96 MHz. Source waveform/drive/load/startup remain board obligations.
        - HSI defaults to nominal8 MHz, while CCS independently forces nominal4 MHz; both sources and
          selected HSE are qualified through final buses and Flash waits. Legal incoming HSIOSC90..100MHz
          is an entry requirement, not a measurement or a guarantee for arbitrary trim.
        - Undeclared enabled HSE fails before MMIO writes. All declared enabled HSE requires exact ready
          source and pad reuse without oscillator/pad writes, regardless of retained RTC/AWT selection.
        - RTC raw-HSI ownership blocks retrim; PSC1-derived actual RTCCLKD must already be <=1 MHz.
          ADC1/ADC2 EN, four-comparator PCLK filters or any CR2 blanking, OPA calibration and enabled DAC
          trigger/DMA/wave operation are rejected. LVD is inspected directly, without an invented gate.
        - Preserve static analog owners and BGR/TS/references, configurable CCS, unchanged legal LSI,
          retained RTC/AWT and common LSE reservations. No PLL, DIGFLT, automatic HEXEN, live retuning,
          sleep/resume or source-loss recovery. Finite polls require continuing CPU progress.
      - families: [CW32L052]
        status: partial
        scope: Direct HSE crystal/bypass on all three modeled exact packages; one-time initialization only.
        limitations:
        - Explicit actual 4..32 MHz endpoints, VDD 1.65..5.5 V, VDDA=VDD and ambient -40..85 C.
          Actual HCLK/PCLK <=24 MHz below 1.8 V and <=48 MHz otherwise. Board waveform/startup remains unmeasured.
        - Configure/read both pre-start PDRIVER/PFREQRANGE and run DRIVER/FREQRANGE before HSE enable.
          Whole-boot reservations retain the union of inherited enabled and requested source pads.
        - Preserve configurable CCS; qualify requested HSI and hardware fixed HSI/6 fallback independently
          for final buses and Flash. Retain unchanged legal LSI when enabled external detectors require it.
        - Retained RTC/AUTOTRIM HSE requires exact ready parameter/pad reuse. Active calibration, automatic
          mode and ETR with an HSE request are excluded; raw-HSI AUTOTRIM/LVD blocks required retrim.
        - No PLL exists. Active LSE is separately qualified below. No runtime switching, sleep/resume or source-loss recovery. Finite polls
          require CPU progress; STABLE is a startup latch; failure requires reset and frozen rates are invalid after loss.
      - families: [CW32L083]
        status: partial
        scope: Direct HSE crystal or bypass on all five modeled exact packages; one-time initialization only.
        limitations:
        - Board declares the complete actual 4..32 MHz interval, VDD 1.65..5.5 V with VDDA equal to VDD,
          and ambient -40..85 C. Actual HCLK/PCLK are limited to 24 MHz below 1.8 V and 64 MHz otherwise.
        - Crystal reserves PF0/PF1 and bypass reserves PF0. Own GPIO LCKR is keyed; inherited enabled
          HSE reserves its pads for the boot. Board waveform, load, drive and startup remain unmeasured.
        - Preserve configurable CCS and unchanged legal LSI for enabled HSE/LSE detectors. Retained
          HSI fallback is independently qualified against final bus and Flash limits.
        - Retained RTC or enabled AUTOTRIM TIMER HSE requires exact ready source/pad reuse. Active
          AUTOTRIM calibration, automatic mode, reserved sources and ETR with HSE are excluded.
          Raw-HSI AUTOTRIM/LVD consumers block required retrim; divider-only changes preserve HSIOSC.
        - Inherited PLL entry first escapes through unchanged HSI; stop and observe PLL not stable before
          source oscillator/divider changes. Relevant HSE/LSE sticky faults are rejected, never cleared.
        - Active LSE and HSE-fed PLL are separately qualified below. No runtime switching, sleep/resume or source-loss recovery.
          STABLE is a startup latch and frozen HSE rates become invalid after loss or HSI fallback.
