    - id: owned_bus_clock_output
      status: partial
      scope: Immutable owned HCLK/PCLK MCO on exactly CW32F030C8T7, CW32F030K8T7, CW32F030K8U7 and CW32A030C8T7 PA8 AF4; real SYSCTRL and PA8 owners, all eight own-documented divisors.
      implemented_families: [CW32F030, CW32A030]
      pins_all: [MCO]
      registers_any: [MCO]
      limitations:
      - F030C8T7 and A030C8T7 use LQFP48 PA8 pin29; F030K8T7 uses LQFP32 pin18 and F030K8U7 uses QFN32 pin18. Generic family/density aliases and all other selections remain excluded; absent qualification is not silicon absence.
      - K8 requires PC14/PC15 and both LSE routes absent everywhere; both C8T7 parts require them. PF0/PF1 HSE reservations remain required on all four; GPIOC and die-level LSE registers are not removed.
      - A030 binds its own DS CN1.1 and shared x030 RM CN2.5; the F030 SDK retains F030 provenance and is supplementary for A030. Package power limits at 105 C differ (LQFP48 364 mW, LQFP32 357 mW, QFN32 541 mW); own current/junction/thermal limits still apply.
      - Admission requires published initialized cycle-qualified bus bounds and explicit ordered source-compatible board voltage/ambient/load declarations. Frozen Clocks does not retain the earlier init declaration; caller consistency remains required.
      - Exact divided maximum is at most 20 MHz, with 2.4..5.5 V, -40..105 C and 0 < total load <= 50 pF. Rate-only PLL/LSI roots fail even at a low divided rate; source conditions can narrow the admitted interval.
      - The vendor fmax table is unmeasured design/simulation data conditioned on loaded 45..55 percent duty and tr+tf <= 2T/3. Rate admission and integer division do not prove waveform or receiver suitability; board qualification remains required.
      - GPIOA whole-bank enable can advance other pins and armed events before success or error. PA8 stays unlocked, prior function is not restored and shared GPIOA stays enabled. Constructor MCO/pin-error cleanup drops the local Flex before SOURCE disable; cleanup booleans are bounded observations. Normal Drop disconnects the retained Flex before SOURCE disable, then Flex drops; Drop has no acknowledgement result and forget may leave output active.
      - Real SYSCTRL excludes simultaneous live safe CalendarClock/LsiClock/LseClock and an Rtc retaining a clock; a forgotten reborrow can leave hardware active after later token reuse.
      - No source/divider setter, oscillator/system/bus-clock transition, raw oscillator or PLL output, sleep/fault recovery or hardware-validation claim. Nominal/rounded getters are not measurements; duration getters panic for unrepresentable u64 nanoseconds.
