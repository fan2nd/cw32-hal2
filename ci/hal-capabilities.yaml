      - families: [CW32F020]
        scope: Safe staged byte UART TX, finite RX and combined/split DMA on exactly CW32F020C6U7/K6U7/F6U7, through native CH1/CH2; separate Stage93 SPI1/SPI2 paired byte DMA has main software acceptance, with final-source clean replay unrun at that point.
        limitations:
        - Exact 8 KiB SRAM at 0x20000000..0x20002000 and normal reset/clean-runtime admission are required; generic cw32f020 rejects safe DMA/staging with MissingMemoryMetadata.
        - Native CH1/CH2 use independent DMACH1/DMACH2 IRQs. UART1/2/3 RX selectors 0/2/4 and TX selectors 1/3/5 may use either channel, subject to safe package pins.
        - SPI1 RX/TX uses 6/7 and SPI2 uses 8/9. One full-duplex pair consumes both permanent admissions; SPI1/SPI2 DMA examples are separate deployments. Clean Drop does not restore admission; borrowed PIO on another controller remains available.
        - F6 UART1 has no safe RX or TX; PA13/PA14/PF3 remain excluded. Combined UART requires distinct safe TX/RX pins, distinct admitted channels and independent exclusive static stages.
        - Own CN1.4 p288 qualifies byte RDR-to-SRAM DMA; own SDK requires software RC clear. FE/PE/RC have no ORE/NE indication; typed ICR no-op preserves unrelated fields.
        - Static UART/channel/staging owners survive cancellation and forget. Clean retirement requires recorded TC without TE plus STATUS5, request closure and fencing before staged-byte access; DMA faults permanently quarantine affected resources.
        - FE/PE returns promptly while an invalid pending chunk remains running; later inherent recovery awaits its old count. Clean RX tails remain available. CPU copies and chunk/rearm gaps can lose frames without a loss count.
        - TX completion retires memory-to-TDR work; flush separately waits for the wire. SPI DMA has its separate declared scope; no other peripheral DMA consumers, new raw hardware requests, buffered-plus-DMA owner, RTS/CTS or idle/circular DMA, early abort, zero-copy or finite-liveness guarantee.
