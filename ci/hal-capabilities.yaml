  atim:
    register_kinds:
    - atim
    evidence:
    - path: embassy-cw32/src/timer/low_level.rs
      anchor: pub struct Timer
    - path: embassy-cw32/src/timer/mod.rs
      anchor: pub trait BasicInstance
    modes:
    - id: polling_counter
      status: partial
      scope: Owned internal-PCLK continuous up-counter with polling overflow.
      limitations:
      - No APB timer multiplier; qualified prescalers and actual clock bounds apply. BTIM shared gate/reset
        is retained.
    - id: irq_dma_other_counting
      status: unimplemented
      scope: No maintained HAL API declaration for this mode.
      limitations:
      - General counter/capture IRQ, DMA and other counting modes are absent; optional Embassy time and L010/L011
        routes are listed separately.
    - id: main_pwm
      status: partial
      scope: Owned main-output PWM on qualified external channels.
      limitations:
      - "Classic ATIM exposes three main A outputs and internal CH4 is excluded; buffered ATIM main outputs\
        \ are CH1\u20134. Whole-timer phase/update constraints remain."
      evidence:
      - path: embassy-cw32/src/timer/simple_pwm.rs
        anchor: pub struct SimplePwm
      - path: embassy-cw32/src/timer/advanced/mod.rs
      pins_any:
      - CH1
      - CH2
      - CH3
      - CH4
      - CH1A
      - CH2A
      - CH3A
    - id: capture
      status: partial
      scope: Owned polling direct external input capture.
      limitations:
      - Each capture is one latch; no lossless history, async or DMA. Classic encoder reload is fixed at 65535;
        count/direction/wrap samples are non-atomic.
      evidence:
      - path: embassy-cw32/src/timer/input_capture.rs
      - path: cw32-data/classic-timer-input.yaml
      implemented_families: &id001
      - CW32L010
      - CW32L011
      - CW32L012
      pin_signal_sets:
