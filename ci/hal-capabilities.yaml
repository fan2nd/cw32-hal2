      - path: embassy-cw32/src/rcc/l031_r031_w031/mod.rs
        anchor: pub enum HseMode
      - path: embassy-cw32/src/rcc/l010_l011/mod.rs
        anchor: pub enum HseMode
      - path: docs/qualified-l010-l011-hse.md
