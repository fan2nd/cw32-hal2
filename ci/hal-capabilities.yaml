        - SPI cancellation retains the active chunk; original GPIO CS must remain asserted through successful flush. Both clean terminals, wire idle and fenced retirements precede receive-byte access; errors quarantine and unresolved Drop retains the entire pair, SPI, pins and clocks without a hidden wait.
        - Native SPI main passed 6 standalone ARM libraries and 15 ELF links in 21 accepted Cargo rows, all exiting zero, plus five finite main commands, with independent runtime/source acceptance. At main acceptance final-source clean had not run; completion requires its separate 2-library/6-ELF receipt after one generation bootstrap; no hardware result is claimed.
