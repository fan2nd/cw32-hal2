        - Normal reset/clean-runtime entry and conservative one-time admission apply; dirty state is rejected without reset or recovery.
        - Independent CH1/CH2 IRQs and native four-field R1W0 ICR commands preserve the other channel and shared clock.
        - Only recorded TC without TE plus STATUS5 and SOFTSRC0 returns the same capability and exclusive static u8/u16/u32 buffers.
        - Error or inconsistent completion permanently retains owners; forget leaks and Drop can block forever. No early abort, timeout recovery or raw API extension is qualified.
