    - id: pll
      status: partial
      scope: CW32F020/CW32F030/CW32A030/CW32L083 factory-HSI- or HSE-fed PLL as the one-time system source, with exact qualified rate bounds.
      implemented_families: [CW32F020, CW32F030, CW32A030, CW32L083]
      limitations:
