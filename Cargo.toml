[workspace]
# Authored host generators can build before the PAC exists.
exclude = ["firmware", "embassy-cw32", "cw32-metapac", "examples"]
resolver = "2"
members = ["cw32-data-serde", "cw32-data-macros", "cw32-data-gen", "cw32-metapac-gen"]
default-members = ["cw32-data-serde", "cw32-data-macros", "cw32-data-gen", "cw32-metapac-gen"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "=0.9.34-deprecated"

chiptool = { git = "https://github.com/embassy-rs/chiptool", rev = "be1bff3e9e1b27b090e69bd9ac753c66fdcce678" }
