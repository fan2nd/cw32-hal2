name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  generated-pac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
          components: rustfmt
      - name: Validate normalized data and regenerate PAC
        run: |
          python3 -m pip install -r requirements-dev.txt
          ./d fetch-sources
          ./d gen-all
          ./d check
      - name: Acquire pinned official source-audit evidence
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 -m pip install -r requirements-dev.txt
          ./d fetch-evidence
      - name: Generator and metadata tests
        run: ./d test
      - name: Current official source and hardware facts
        run: ./d audit-current
  hal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HAL all-chip ARM builds and firmware examples
        run: |
          python3 -m pip install -r requirements-dev.txt
          ./d fetch-sources
          ./d gen-all
          ./ci/check-hal.sh
