[package]
workspace = "../firmware"
name = "cw32-metapac"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Generated CW32 peripheral access API and Embassy-shaped metadata"
include = ["**/*.rs", "**/*.x", "Cargo.toml", "README.md"]

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = { version = "0.7.5", optional = true }
defmt = { version = "1", optional = true }

[features]
default = ["pac"]
pac = []
metadata = []
defmt = ["dep:defmt"]
rt = ["cortex-m-rt/device"]

