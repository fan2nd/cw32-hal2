[package]
name = "cw32-embassy-time-example"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
[features]
default = ["cw32f030c8t7"]
generic-queue = ["embassy-time-queue-utils/generic-queue-8"]
cw32a030c8t7 = ["embassy-cw32/cw32a030c8t7", "cw32-metapac/cw32a030c8t7", "embassy-cw32/time-driver-gtim1"]
cw32f030c8t7 = ["embassy-cw32/cw32f030c8t7", "cw32-metapac/cw32f030c8t7", "embassy-cw32/time-driver-gtim1"]
cw32f002f3p7 = ["embassy-cw32/cw32f002f3p7", "cw32-metapac/cw32f002f3p7", "embassy-cw32/time-driver-gtim"]
cw32f003e4p7 = ["embassy-cw32/cw32f003e4p7", "cw32-metapac/cw32f003e4p7", "embassy-cw32/time-driver-gtim"]
cw32f020c6u7 = ["embassy-cw32/cw32f020c6u7", "cw32-metapac/cw32f020c6u7", "embassy-cw32/time-driver-gtim1"]
cw32l010f8p6 = ["embassy-cw32/cw32l010f8p6", "cw32-metapac/cw32l010f8p6", "embassy-cw32/time-driver-gtim1"]
cw32l011k8t6 = ["embassy-cw32/cw32l011k8t6", "cw32-metapac/cw32l011k8t6", "embassy-cw32/time-driver-gtim1"]
cw32l012c8t6 = ["embassy-cw32/cw32l012c8t6", "cw32-metapac/cw32l012c8t6", "embassy-cw32/time-driver-gtim1"]
cw32l031c8t6 = ["embassy-cw32/cw32l031c8t6", "cw32-metapac/cw32l031c8t6", "embassy-cw32/time-driver-gtim1"]
cw32r031c8u6 = ["embassy-cw32/cw32r031c8u6", "cw32-metapac/cw32r031c8u6", "embassy-cw32/time-driver-gtim1"]
cw32w031r8u6 = ["embassy-cw32/cw32w031r8u6", "cw32-metapac/cw32w031r8u6", "embassy-cw32/time-driver-gtim1"]
cw32l052c8t6 = ["embassy-cw32/cw32l052c8t6", "cw32-metapac/cw32l052c8t6", "embassy-cw32/time-driver-gtim1"]
cw32l083rct6 = ["embassy-cw32/cw32l083rct6", "cw32-metapac/cw32l083rct6", "embassy-cw32/time-driver-gtim1"]

[dependencies]
embassy-cw32 = { path = "../../embassy-cw32", default-features = false }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "f16efeffe37581092ec184718e6fdb1620393214", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "f16efeffe37581092ec184718e6fdb1620393214" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "f16efeffe37581092ec184718e6fdb1620393214" }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"

[build-dependencies]
cw32-metapac = { path = "../../cw32-metapac", default-features = false, features = ["metadata"] }

[profile.dev]
opt-level = "s"
debug = 0
incremental = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 0
incremental = false
