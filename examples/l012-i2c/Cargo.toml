[package]
name = "cw32-l012-i2c-examples"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
autobins = false

[workspace]

[features]
default = []
cw32l012c8t6 = ["embassy-cw32/cw32l012c8t6", "cw32-metapac/cw32l012c8t6"]
cw32l012c8u6 = ["embassy-cw32/cw32l012c8u6", "cw32-metapac/cw32l012c8u6"]

[[bin]]
name = "async_master"
path = "src/bin/async_master.rs"

[[bin]]
name = "blocking_master"
path = "src/bin/blocking_master.rs"

[[bin]]
name = "ten_bit_master"
path = "src/bin/ten_bit_master.rs"

[[bin]]
name = "retry_probe"
path = "src/bin/retry_probe.rs"

[dependencies]
embassy-cw32 = { path = "../../embassy-cw32", default-features = false, features = ["rt"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "f16efeffe37581092ec184718e6fdb1620393214", features = ["platform-cortex-m", "executor-thread"] }
embedded-hal-async = "1.0.0"
embedded-hal = "1.0.0"
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"

[build-dependencies]
cw32-metapac = { path = "../../cw32-metapac", default-features = false, features = ["metadata"] }

[profile.dev]
opt-level = "s"
debug = 0
incremental = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = 0
incremental = false
