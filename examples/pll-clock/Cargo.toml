[package]
name = "cw32-pll-clock-examples"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
[features]
default = ["cw32l083rct6"]
# The alternate clock choices demonstrate a fractional-MHz source and a low-VDD bus.
fractional = []
low-voltage = []
embassy-time = ["dep:embassy-executor", "dep:embassy-time", "embassy-cw32/time-driver-gtim1"]
cw32l083rbt6 = ["embassy-cw32/cw32l083rbt6", "cw32-metapac/cw32l083rbt6"]
cw32l083rcs6 = ["embassy-cw32/cw32l083rcs6", "cw32-metapac/cw32l083rcs6"]
cw32l083rct6 = ["embassy-cw32/cw32l083rct6", "cw32-metapac/cw32l083rct6"]
cw32l083mct6 = ["embassy-cw32/cw32l083mct6", "cw32-metapac/cw32l083mct6"]
cw32l083vct6 = ["embassy-cw32/cw32l083vct6", "cw32-metapac/cw32l083vct6"]

[dependencies]
embassy-cw32 = { path = "../../embassy-cw32", default-features = false, features = ["rt"] }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "f16efeffe37581092ec184718e6fdb1620393214", features = ["platform-cortex-m", "executor-thread"], optional = true }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "f16efeffe37581092ec184718e6fdb1620393214", optional = true }

[build-dependencies]
cw32-metapac = { path = "../../cw32-metapac", default-features = false, features = ["metadata"] }

[[bin]]
name = "pll-uart"
path = "src/bin/pll-uart.rs"

[[bin]]
name = "pll-time"
path = "src/bin/pll-time.rs"
required-features = ["embassy-time"]

[profile.dev]
opt-level = "s"
debug = 0
incremental = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 0
incremental = false
