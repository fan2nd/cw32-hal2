[package]
name = "cw32-f020-dma-example"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
autobins = false

[workspace]

[features]
default = []
cw32f020c6u7 = ["embassy-cw32/cw32f020c6u7", "cw32-metapac/cw32f020c6u7"]
cw32f020k6u7 = ["embassy-cw32/cw32f020k6u7", "cw32-metapac/cw32f020k6u7"]
cw32f020f6u7 = ["embassy-cw32/cw32f020f6u7", "cw32-metapac/cw32f020f6u7"]

[[bin]]
name = "owned_copy"
path = "src/bin/owned_copy.rs"

[[bin]]
name = "uart_tx"
path = "src/bin/uart_tx.rs"

[dependencies]
embassy-cw32 = { path = "../../embassy-cw32", default-features = false, features = ["rt"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "f16efeffe37581092ec184718e6fdb1620393214", features = ["platform-cortex-m", "executor-thread"] }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"

[build-dependencies]
cw32-metapac = { path = "../../cw32-metapac", default-features = false, features = ["metadata"] }

[profile.dev]
opt-level = "s"
debug = 0
incremental = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 0
incremental = false
