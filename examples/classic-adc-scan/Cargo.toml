[package]
name = "cw32-classic-adc-scan-examples"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
[features]
async = ["dep:embassy-executor", "dep:embassy-time", "dep:embassy-futures"]
async-gtim = ["async", "embassy-cw32/time-driver-gtim"]
async-gtim1 = ["async", "embassy-cw32/time-driver-gtim1"]
default = ["cw32f030c8t7"]
cw32a030c8t7 = ["embassy-cw32/cw32a030c8t7", "cw32-metapac/cw32a030c8t7"]
cw32f030c8t7 = ["embassy-cw32/cw32f030c8t7", "cw32-metapac/cw32f030c8t7"]
cw32f030k8t7 = ["embassy-cw32/cw32f030k8t7", "cw32-metapac/cw32f030k8t7"]
cw32f030k8u7 = ["embassy-cw32/cw32f030k8u7", "cw32-metapac/cw32f030k8u7"]
cw32f030f8v7 = ["embassy-cw32/cw32f030f8v7", "cw32-metapac/cw32f030f8v7"]
cw32f030f6p7 = ["embassy-cw32/cw32f030f6p7", "cw32-metapac/cw32f030f6p7"]
cw32f002f3p7 = ["embassy-cw32/cw32f002f3p7", "cw32-metapac/cw32f002f3p7"]
cw32f002f3u7 = ["embassy-cw32/cw32f002f3u7", "cw32-metapac/cw32f002f3u7"]
cw32f003e4p7 = ["embassy-cw32/cw32f003e4p7", "cw32-metapac/cw32f003e4p7"]
cw32f003f4p7 = ["embassy-cw32/cw32f003f4p7", "cw32-metapac/cw32f003f4p7"]
cw32f003f4u7 = ["embassy-cw32/cw32f003f4u7", "cw32-metapac/cw32f003f4u7"]
cw32f020f6u7 = ["embassy-cw32/cw32f020f6u7", "cw32-metapac/cw32f020f6u7"]
cw32f020k6u7 = ["embassy-cw32/cw32f020k6u7", "cw32-metapac/cw32f020k6u7"]
cw32f020c6u7 = ["embassy-cw32/cw32f020c6u7", "cw32-metapac/cw32f020c6u7"]
cw32l031c8t6 = ["embassy-cw32/cw32l031c8t6", "cw32-metapac/cw32l031c8t6"]
cw32l031c8u6 = ["embassy-cw32/cw32l031c8u6", "cw32-metapac/cw32l031c8u6"]
cw32l031f8p6 = ["embassy-cw32/cw32l031f8p6", "cw32-metapac/cw32l031f8p6"]
cw32l031f8u6 = ["embassy-cw32/cw32l031f8u6", "cw32-metapac/cw32l031f8u6"]
cw32l031k8u6 = ["embassy-cw32/cw32l031k8u6", "cw32-metapac/cw32l031k8u6"]
cw32l031k8v6 = ["embassy-cw32/cw32l031k8v6", "cw32-metapac/cw32l031k8v6"]
cw32r031c8u6 = ["embassy-cw32/cw32r031c8u6", "cw32-metapac/cw32r031c8u6"]
cw32w031r8u6 = ["embassy-cw32/cw32w031r8u6", "cw32-metapac/cw32w031r8u6"]
cw32l052c8t6 = ["embassy-cw32/cw32l052c8t6", "cw32-metapac/cw32l052c8t6"]
cw32l052r8s6 = ["embassy-cw32/cw32l052r8s6", "cw32-metapac/cw32l052r8s6"]
cw32l052r8t6 = ["embassy-cw32/cw32l052r8t6", "cw32-metapac/cw32l052r8t6"]
cw32l083mct6 = ["embassy-cw32/cw32l083mct6", "cw32-metapac/cw32l083mct6"]
cw32l083rbt6 = ["embassy-cw32/cw32l083rbt6", "cw32-metapac/cw32l083rbt6"]
cw32l083rcs6 = ["embassy-cw32/cw32l083rcs6", "cw32-metapac/cw32l083rcs6"]
cw32l083rct6 = ["embassy-cw32/cw32l083rct6", "cw32-metapac/cw32l083rct6"]
cw32l083vct6 = ["embassy-cw32/cw32l083vct6", "cw32-metapac/cw32l083vct6"]

[dependencies]
embassy-cw32 = { path = "../../embassy-cw32", default-features = false, features = ["rt"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "f16efeffe37581092ec184718e6fdb1620393214", optional = true, features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "f16efeffe37581092ec184718e6fdb1620393214", optional = true }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "f16efeffe37581092ec184718e6fdb1620393214", optional = true }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"

[[bin]]
name = "async_single"
path = "src/bin/async_single.rs"
required-features = ["async"]

[[bin]]
name = "async_scan_borrowed"
path = "src/bin/async_scan_borrowed.rs"
required-features = ["async"]

[build-dependencies]
cw32-metapac = { path = "../../cw32-metapac", default-features = false, features = ["metadata"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 0
